name: Agent Task

on:
  workflow_dispatch:
    inputs:
      task:
        description: "One bounded task for the ackOS agent"
        required: true
        type: string
      authorized_test_paths:
        description: "Optional comma/newline-separated exact *_test.go paths authorized for modification or deletion"
        required: false
        default: ""
        type: string

# The agent and publisher are isolated in separate jobs. The App token is only
# created in the publisher job after independent validation succeeds.
permissions:
  contents: read
  actions: read

concurrency:
  group: ackos-agent-task
  cancel-in-progress: false

jobs:
  agent:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Install pinned Claude Code CLI without API credentials
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          HOME: ${{ runner.temp }}/claude-cli-home
          GITHUB_ENV: /dev/null
          GITHUB_PATH: /dev/null
          GITHUB_OUTPUT: /dev/null
          ANTHROPIC_API_KEY: ""
          INPUT_ANTHROPIC_API_KEY: ""
          NODE_OPTIONS: ""
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          GITHUB_WORKSPACE: /dev/null
          GITHUB_REPOSITORY: ""
          GITHUB_SERVER_URL: ""
        run: |
          mkdir -p "$HOME"
          curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.310
          test -x "$HOME/.local/bin/claude"
          "$HOME/.local/bin/claude" --version

      - name: Check required secrets
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACKOS_AGENT_APP_ID: ${{ secrets.ACKOS_AGENT_APP_ID }}
          ACKOS_AGENT_APP_PRIVATE_KEY: ${{ secrets.ACKOS_AGENT_APP_PRIVATE_KEY }}
        run: |
          missing=0
          for name in ANTHROPIC_API_KEY ACKOS_AGENT_APP_ID ACKOS_AGENT_APP_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository secret $name is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Verify baseline
        run: |
          go version
          go mod download
          go test ./...
          test -z "$(git status --porcelain)"

      - name: Record trusted base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run bounded agent task
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          # This job's action receives the API key, but no arbitrary shell or test
          # execution is allowed while that key is present.
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ runner.temp }}/claude-cli-home/.local/bin/claude
          prompt: |
            Perform this one bounded task in the ackOS repository:

            ${{ inputs.task }}

            Required workflow:
            - Read AGENTS.md and PR_REVIEW_LOOP.md before changing files.
            - Keep changes limited to the requested task. Do not reopen settled architecture or add hypothetical safeguards.
            - Do not modify .github/**, AGENTS.md, PR_REVIEW_LOOP.md, go.mod, or go.sum.
            - Do not modify or delete existing *_test.go files unless the dispatch input explicitly authorizes their exact paths.
            - Authorized existing test paths (empty means none):
            ${{ inputs.authorized_test_paths }}
            - You may add new *_test.go files.
            - Do not add dependencies without explicit authorization.
            - Do not run tests or other code from the edited workspace in this job. A separate secret-free job will validate the patch.
            - Do not push, commit, or open a PR. The workflow exports only a text patch; a fresh runner validates and publishes it.
            - If the task requires a contract or architecture decision not already approved, stop and report the decision needed instead of implementing it.
          claude_args: >-
            --max-turns 20
            --allowedTools "Read,Edit,Write,Glob,Grep"
            --disallowedTools "Read(/proc/**),Read(/sys/**),Read(/run/**),Read(/dev/**),Read(/tmp/**),Read(/etc/**),Read(/var/run/**),Read(/home/runner/work/_temp/**),Read(/github/**),Edit(/proc/**),Edit(/sys/**),Edit(/run/**),Edit(/dev/**),Edit(/tmp/**),Edit(/etc/**),Edit(/var/run/**),Edit(/home/runner/work/_temp/**),Edit(/github/**),Write(/proc/**),Write(/sys/**),Write(/run/**),Write(/dev/**),Write(/tmp/**),Write(/etc/**),Write(/var/run/**),Write(/home/runner/work/_temp/**),Write(/github/**),Glob(/proc/**),Glob(/sys/**),Glob(/run/**),Glob(/dev/**),Glob(/tmp/**),Glob(/etc/**),Glob(/var/run/**),Glob(/home/runner/work/_temp/**),Glob(/github/**),Grep(/proc/**),Grep(/sys/**),Grep(/run/**),Grep(/dev/**),Grep(/tmp/**),Grep(/etc/**),Grep(/var/run/**),Grep(/home/runner/work/_temp/**),Grep(/github/**)"
          additional_permissions: |
            actions: read

      - name: Export text patch from a fresh trusted checkout
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          # Never trust the agent job's .git directory, config, refs, or hooks.
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          trusted="$RUNNER_TEMP/trusted-checkout"
          git clone --quiet --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$trusted"
          git -C "$trusted" checkout --quiet --detach "$BASE_SHA"
          # Copy working-tree files only; rsync preserves symlinks without following them.
          rsync -a --delete --exclude='.git' "$GITHUB_WORKSPACE/" "$trusted/"
          git -C "$trusted" -c core.hooksPath=/dev/null add -N -f -- .
          git -C "$trusted" --no-pager -c core.pager=cat diff --no-ext-diff --no-textconv --no-renames --unified=3 HEAD -- . > "$RUNNER_TEMP/agent.patch"
          test -s "$RUNNER_TEMP/agent.patch"

      - name: Upload untrusted patch artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/agent.patch
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Download untrusted patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-patch

      - name: Check patch applicability and policy
        shell: bash
        env:
          AUTHORIZED_TEST_PATHS: ${{ inputs.authorized_test_paths }}
        run: |
          patch="$RUNNER_TEMP/agent-patch/agent.patch"
          git apply --check --whitespace=error-all "$patch"
          python3 .github/scripts/validate-agent-patch.py "$patch" --authorized-test-paths "$AUTHORIZED_TEST_PATHS"
          git apply --whitespace=error-all "$patch"
          git diff --check
          if git diff --summary | grep -E 'mode change|create mode (100755|120000|160000)|rename'; then
            echo "::error::Mode changes, symlinks, submodules, and renames are not allowed."
            exit 1
          fi

      - name: Set up Go from go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Validate patch without secrets
        shell: bash
        run: |
          go mod download
          git diff --binary > "$RUNNER_TEMP/before-tests.diff"
          go version
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race ./...
          git diff --check
          git diff --binary > "$RUNNER_TEMP/after-tests.diff"
          cmp "$RUNNER_TEMP/before-tests.diff" "$RUNNER_TEMP/after-tests.diff"

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Download untrusted patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-patch

      - name: Revalidate and apply patch on clean publisher
        shell: bash
        env:
          AUTHORIZED_TEST_PATHS: ${{ inputs.authorized_test_paths }}
        run: |
          patch="$RUNNER_TEMP/agent-patch/agent.patch"
          # Publisher trusts only this checked-out main-branch policy script.
          git apply --check --whitespace=error-all "$patch"
          python3 .github/scripts/validate-agent-patch.py "$patch" --authorized-test-paths "$AUTHORIZED_TEST_PATHS"
          # Apply directly to the index: no checkout filters or patch-provided code run.
          git apply --cached --check --whitespace=error-all "$patch"
          git apply --cached --whitespace=error-all "$patch"
          git diff --cached --check
          if git diff --cached --summary | grep -E 'mode change|create mode (100755|120000|160000)|rename'; then
            echo "::error::Mode changes, symlinks, submodules, and renames are not allowed."
            exit 1
          fi
          test -n "$(git diff --cached --name-only)"
          git -c core.hooksPath=/dev/null \
              -c user.name="ackOS Agent Publisher" \
              -c user.email="ackos-agent-publisher@users.noreply.github.com" \
              -c commit.gpgsign=false \
              commit -m "agent: apply validated task patch"

      - name: Create least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.ACKOS_AGENT_APP_ID }}
          private-key: ${{ secrets.ACKOS_AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ackOS
          permission-contents: write
          permission-pull-requests: write

      - name: Push validated commit and open PR
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="feature/agent-task-$RUN_ID"
          case "$branch" in
            feature/agent-task-[0-9]*) ;;
            *) echo "::error::Invalid publisher branch name"; exit 1 ;;
          esac
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --head "$branch" \
            --base main \
            --title "agent: bounded task" \
            --body "Automated bounded task patch. The patch was structurally validated on a fresh runner, then independently tested without secrets. Review the diff and CI results before merging."
