name: PR10 vet debug
on:
  push:
    branches: [feat/phase2-git-provider]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-git-provider
          fetch-depth: 0
      - name: Fix provider
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          s = s.replace('return verifyCommitAt(e.Target, func(args ...string) (string, error) { return e.git(ctx, args...) }, parent, t, executionID)', 'return verifyCommitAt(ctx, e.Target, func(args ...string) (string, error) { return e.git(ctx, args...) }, parent, t, executionID)')
          s = s.replace('return verifyCommitAt(v.Target, func(args ...string) (string, error) { return v.git(ctx, args...) }, "", t, executionID)', 'return verifyCommitAt(ctx, v.Target, func(args ...string) (string, error) { return v.git(ctx, args...) }, "", t, executionID)')
          s = s.replace('func verifyCommitAt(target Target, git func(...string) (string, error), expectedParent string, t kernel.Transition, executionID string) error {', 'func verifyCommitAt(ctx context.Context, target Target, git func(...string) (string, error), expectedParent string, t kernel.Transition, executionID string) error {')
          p.write_text(s)
          PY
          gofmt -w integrations/git/provider.go
          go vet ./...
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/git/provider.go
          git commit -m 'fix: pass verification context to Git commit checks'
          git push origin HEAD:feat/phase2-git-provider
