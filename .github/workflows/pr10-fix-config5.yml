name: PR10 Fix Config5

on:
  push:
    branches: [feat/phase2-git-provider]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use local Git config sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          old = '"config", "--includes", "--get-regexp", "^include"'
          new = '"config", "--local", "--get-regexp", "^include"'
          if old not in s:
              raise SystemExit('local config replacement target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          gofmt -w integrations/git/provider.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/git/provider.go
          git commit -m 'fix: inspect local Git config includes directly'
          git push
