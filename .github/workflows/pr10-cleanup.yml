name: PR10 Cleanup

on:
  push:
    branches: [feat/phase2-git-provider]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/current_findings_test.go')
          s = p.read_text()
          s = s.replace('''\tdebugConfig, debugErr := runGit(context.Background(), target.Repository, "config", "--local", "--get-regexp", "^include")\n\tt.Logf("local include config: %q err=%v", debugConfig, debugErr)\n\terr := rejectGitConfigTarget(context.Background(), target)\n''', '''\terr := rejectGitConfigTarget(context.Background(), target)\n''')
          s = s.replace('''\t\tt.Fatalf("error = %v, local include config = %q, debug err = %v, want active Git configuration source rejection", err, debugConfig, debugErr)\n''', '''\t\tt.Fatalf("error = %v, want active Git configuration source rejection", err)\n''')
          p.write_text(s)
          PY
          gofmt -w integrations/git/current_findings_test.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/git/current_findings_test.go
          git commit -m 'chore: remove temporary PR10 diagnostics'
          git fetch origin feat/phase2-git-provider
          git rebase origin/feat/phase2-git-provider
          git push origin HEAD:feat/phase2-git-provider
