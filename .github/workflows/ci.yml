name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate agent integrations
        run: |
          test -f .claude-plugin/plugin.json
          test -f gemini-extension.json
          test -f GEMINI.md
          test -f skills/control/SKILL.md
          test -f skills/ackos-control/SKILL.md
          test -f integrations/chatgpt/SKILL.md
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool gemini-extension.json >/dev/null
          while IFS= read -r skill; do
            ruby -e '
              require "yaml"
              lines = STDIN.read.lines
              abort unless lines.first&.strip == "---"
              end_index = lines[1..]&.index { |line| line.strip == "---" }
              abort unless end_index
              frontmatter = lines[1, end_index].join
              begin
                metadata = YAML.safe_load(frontmatter, permitted_classes: [], aliases: false)
              rescue Psych::Exception
                abort
              end
              abort unless metadata.is_a?(Hash)
              description = metadata["description"]
              abort unless description.is_a?(String) && !description.strip.empty?
            ' < "$skill" || {
              echo "Invalid YAML description frontmatter in $skill"
              exit 1
            }
          done < <(git ls-files -- '*SKILL.md')
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  git-provider-validation-temporary:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print checkout, event, PR-head, and base SHAs
        run: |
          git fetch origin "refs/heads/${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}"
          echo "CHECKOUT_SHA=$(git rev-parse HEAD)"
          echo "EVENT_SHA=$(git rev-parse "$GITHUB_SHA")"
          echo "PR_HEAD_SHA=$(git rev-parse "origin/${GITHUB_HEAD_REF}")"
          echo "BASE_SHA=$(git rev-parse origin/main)"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Baseline and race validation
        run: |
          go test ./...
          go test -race ./integrations/mcp -run '^TestGitProviderRejectsABAInjectedBetweenObserveAndExecute$' -count=1
      - name: Mutation-check Git provider safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          def mutation(name, path, old, new, test_args, expected):
              file = Path(path)
              original = file.read_text()
              if original.count(old) != 1:
                  raise SystemExit(f"{name}: expected exactly one mutation target")
              try:
                  file.write_text(original.replace(old, new, 1))
                  result = subprocess.run(["go", "test", *test_args], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print(f"===== mutation: {name}; go test exit={result.returncode} =====")
                  print(result.stdout)
                  if result.returncode == 0:
                      raise SystemExit(f"{name}: mutation was not caught; test unexpectedly passed")
                  if expected not in result.stdout:
                      raise SystemExit(f"{name}: test failed for an unexpected reason; expected marker {expected!r}")
                  print(f"MUTATION_CAUGHT: {name}")
              finally:
                  file.write_text(original)

          mutation(
              "lineage must map to stale_observation",
              "integrations/git/provider.go",
              "return control.Execution{}, fmt.Errorf(\"%w: %w\", control.ErrStaleObservation, ErrStaleLineage)",
              "return control.Execution{}, ErrStaleLineage",
              ["./integrations/git", "-run", "^TestProviderAtoBtoARejectsStaleOriginalObservation$", "-count=1"],
              "want control.ErrStaleObservation",
          )
          mutation(
              "ref CAS must map to stale_observation",
              "integrations/git/ref.go",
              "if err != nil && strings.Contains(err.Error(), \"is at \") && strings.Contains(err.Error(), \" but expected \") {\n\t\treturn fmt.Errorf(\"%w: %w\", ErrRefCASConflict, err)\n\t}\n\treturn err",
              "return err",
              ["./integrations/git", "-run", "^TestUpdateRefRejectsStaleExpectedOld$", "-count=1"],
              "want ErrRefCASConflict",
          )
          mutation(
              "forged trailer must be rejected",
              "integrations/git/provider.go",
              "if !hasExactlyOneTrailer(commit.Message, \"AckOS-Execution\", req.ExecutionID) ||\n\t\t!hasExactlyOneTrailer(commit.Message, \"AckOS-Target\", p.path) {",
              "if false {",
              ["./integrations/git", "-run", "^TestProviderVerifyRejectsForgedTrailer$", "-count=1"],
              "want forged-trailer rejection",
          )
          mutation(
              "claimed commit must match branch tip",
              "integrations/git/provider.go",
              "if tip != evidence.Commit {",
              "if false {",
              ["./integrations/git", "-run", "^TestProviderVerifyRejectsClaimedCommitMismatch$", "-count=1"],
              "want claimed-commit mismatch",
          )
          mutation(
              "claimed commit must have authorized parent",
              "integrations/git/provider.go",
              "if len(commit.Parents) != 1 || commit.Parents[0] != evidence.Parent {",
              "if false {",
              ["./integrations/git", "-run", "^TestProviderVerifyRejectsWrongParentDespiteMatchingTrailers$", "-count=1"],
              "want wrong-parent rejection",
          )
          mutation(
              "tree diff must reject added files",
              "integrations/git/provider.go",
              "if len(changed) != 1 || changed[0] != p.path {",
              "if false {",
              ["./integrations/git", "-run", "^TestProviderVerifyRejectsNonSinglePathAndModeChanges/extra_file$", "-count=1"],
              "Verify accepted a forged tree change",
          )
          mutation(
              "tree diff must reject sibling changes",
              "integrations/git/provider.go",
              "if len(changed) != 1 || changed[0] != p.path {",
              "if false {",
              ["./integrations/git", "-run", "^TestProviderVerifyRejectsNonSinglePathAndModeChanges/sibling_modified$", "-count=1"],
              "Verify accepted a forged tree change",
          )
          mutation(
              "target file mode must be preserved",
              "integrations/git/provider.go",
              "afterEntry.Object != desired || afterEntry.Mode != beforeEntry.Mode ||",
              "afterEntry.Object != desired ||",
              ["./integrations/git", "-run", "^TestProviderVerifyRejectsNonSinglePathAndModeChanges/target_mode_changed$", "-count=1"],
              "Verify accepted a forged tree change",
          )
          mutation(
              "desired object must be an existing blob before writing",
              "integrations/git/provider.go",
              "if _, err := p.repo.ReadBlob(ctx, desired); err != nil {\n\t\treturn control.Execution{}, fmt.Errorf(\"git provider: desired object is not an existing blob: %w\", err)\n\t}",
              "",
              ["./integrations/git", "-run", "^TestProviderRejectsMissingDesiredBlobBeforeRefWrite$", "-count=1"],
              "want missing blob rejection",
          )
          mutation(
              "desired object must not be a commit",
              "integrations/git/provider.go",
              "if _, err := p.repo.ReadBlob(ctx, desired); err != nil {\n\t\treturn control.Execution{}, fmt.Errorf(\"git provider: desired object is not an existing blob: %w\", err)\n\t}",
              "",
              ["./integrations/git", "-run", "^TestProviderRejectsNonBlobDesiredObjectBeforeRefWrite$", "-count=1"],
              "want non-blob rejection",
          )
          print("ALL_MUTATION_CHECKS_CAUGHT")
          PY
