name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate agent integrations
        run: |
          test -f .claude-plugin/plugin.json
          test -f gemini-extension.json
          test -f GEMINI.md
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool gemini-extension.json >/dev/null
          while IFS= read -r skill; do
            grep -q '^description:' "$skill" || {
              echo "Missing description: frontmatter in $skill"
              exit 1
            }
          done < <(git ls-files '*SKILL.md')
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
