name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate agent integrations
        run: |
          test -f .claude-plugin/plugin.json
          test -f gemini-extension.json
          test -f GEMINI.md
          test -f skills/control/SKILL.md
          test -f skills/ackos-control/SKILL.md
          test -f integrations/chatgpt/SKILL.md
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool gemini-extension.json >/dev/null
          while IFS= read -r skill; do
            ruby -e '
              require "yaml"
              lines = STDIN.read.lines
              abort unless lines.first&.strip == "---"
              end_index = lines[1..]&.index { |line| line.strip == "---" }
              abort unless end_index
              frontmatter = lines[1, end_index].join
              begin
                metadata = YAML.safe_load(frontmatter, permitted_classes: [], aliases: false)
              rescue Psych::Exception
                abort
              end
              abort unless metadata.is_a?(Hash)
              description = metadata["description"]
              abort unless description.is_a?(String) && !description.strip.empty?
            ' < "$skill" || {
              echo "Invalid YAML description frontmatter in $skill"
              exit 1
            }
          done < <(git ls-files -- '*SKILL.md')
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Print validation SHAs
        run: |
          echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
          echo "CHECKOUT_SHA=$(git rev-parse HEAD)"
          echo "PR_BASE_SHA=${{ github.event.pull_request.base.sha }}"
      - name: Race-check in-call ABA injection
        run: go test -race ./integrations/mcp -run '^TestGitProviderRejectsABAInjectedBetweenObserveAndExecute$' -count=1
      - name: Mutation check — Execute lineage prefix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("integrations/git/provider.go")
          s = p.read_text()
          old = "if entry.Object != beforeBlob || version != req.Before.Version {"
          assert s.count(old) == 1
          p.write_text(s.replace(old, "if entry.Object != beforeBlob {"))
          PY
          set +e
          go test ./integrations/git -run '^TestProviderAtoBtoARejectsStaleOriginalObservation$' -count=1 2>&1 | tee /tmp/lineage-mutation.log
          status=${PIPESTATUS[0]}
          set -e
          git checkout -- integrations/git/provider.go
          if [ "$status" -eq 0 ]; then echo "lineage-prefix mutation survived"; exit 1; fi
          grep -F -- '--- FAIL: TestProviderAtoBtoARejectsStaleOriginalObservation' /tmp/lineage-mutation.log
          echo "MUTATION_CAUGHT: TestProviderAtoBtoARejectsStaleOriginalObservation"
      - name: Mutation check — Verify parent
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("integrations/git/provider.go")
          s = p.read_text()
          old = "if len(commit.Parents) != 1 || commit.Parents[0] != evidence.Parent {"
          assert s.count(old) == 1
          p.write_text(s.replace(old, "if len(commit.Parents) != 1 {"))
          PY
          set +e
          go test ./integrations/git -run '^TestProviderVerifyRejectsWrongParentDespiteMatchingTrailers$' -count=1 2>&1 | tee /tmp/parent-mutation.log
          status=${PIPESTATUS[0]}
          set -e
          git checkout -- integrations/git/provider.go
          if [ "$status" -eq 0 ]; then echo "parent-check mutation survived"; exit 1; fi
          grep -F -- '--- FAIL: TestProviderVerifyRejectsWrongParentDespiteMatchingTrailers' /tmp/parent-mutation.log
          echo "MUTATION_CAUGHT: TestProviderVerifyRejectsWrongParentDespiteMatchingTrailers"
      - name: Mutation check — Single-path tree diff
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("integrations/git/provider.go")
          s = p.read_text()
          old = "if len(changed) != 1 || changed[0] != p.path {"
          assert s.count(old) == 1
          p.write_text(s.replace(old, "if false {"))
          PY
          set +e
          go test ./integrations/git -run '^TestProviderVerifyRejectsNonSinglePathAndModeChanges$' -count=1 2>&1 | tee /tmp/tree-diff-mutation.log
          status=${PIPESTATUS[0]}
          set -e
          git checkout -- integrations/git/provider.go
          if [ "$status" -eq 0 ]; then echo "single-path diff mutation survived"; exit 1; fi
          grep -F -- '--- FAIL: TestProviderVerifyRejectsNonSinglePathAndModeChanges' /tmp/tree-diff-mutation.log
          echo "MUTATION_CAUGHT: TestProviderVerifyRejectsNonSinglePathAndModeChanges"
      - name: Mutation check — Desired blob type
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("integrations/git/provider.go")
          s = p.read_text()
          old = "if _, err := p.repo.ReadBlob(ctx, desired); err != nil {"
          assert s.count(old) == 1
          p.write_text(s.replace(old, "if _, err := p.repo.ReadBlob(ctx, desired); false {"))
          PY
          set +e
          go test ./integrations/git -run '^TestProviderRejectsCommitObjectAsDesiredBlob$' -count=1 2>&1 | tee /tmp/blob-mutation.log
          status=${PIPESTATUS[0]}
          set -e
          git checkout -- integrations/git/provider.go
          if [ "$status" -eq 0 ]; then echo "blob-type mutation survived"; exit 1; fi
          grep -F -- '--- FAIL: TestProviderRejectsCommitObjectAsDesiredBlob' /tmp/blob-mutation.log
          echo "MUTATION_CAUGHT: TestProviderRejectsCommitObjectAsDesiredBlob"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
