name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PR10 fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/phase2-git-provider'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          replacements = [
          ('''\tif err := rejectAttributesTarget(ctx, e.Target); err != nil {\n\t\treturn fail(err)\n\t}\n\tif err := rejectGrafts(ctx, e.Target); err != nil {''', '''\tif err := rejectAttributesTarget(ctx, e.Target); err != nil {\n\t\treturn fail(err)\n\t}\n\tif err := rejectGitConfigTarget(ctx, e.Target); err != nil {\n\t\treturn fail(err)\n\t}\n\tif err := rejectGrafts(ctx, e.Target); err != nil {'''),
          ('''\tif err := rejectGrafts(ctx, v.Target); err != nil {\n\t\treturn kernel.Observation{}, err\n\t}\n\tcontent, err := v.read(ctx)''', '''\tif err := rejectGitConfigTarget(ctx, v.Target); err != nil {\n\t\treturn kernel.Observation{}, err\n\t}\n\tif err := rejectGrafts(ctx, v.Target); err != nil {\n\t\treturn kernel.Observation{}, err\n\t}\n\tcontent, err := v.read(ctx)'''),
          ('''func rejectGrafts(ctx context.Context, target Target) error {''', '''func rejectGitConfigTarget(ctx context.Context, target Target) error {\n\toutput, err := runGit(ctx, target.Repository, "config", "--show-origin", "--includes", "--list")\n\tif err != nil {\n\t\treturn fmt.Errorf("inspect Git config origins: %w", err)\n\t}\n\tconfigured, err := filepath.Abs(filepath.Join(target.Repository, target.Path))\n\tif err != nil {\n\t\treturn fmt.Errorf("resolve configured target path: %w", err)\n\t}\n\tfor _, line := range strings.Split(output, "\\n") {\n\t\tif !strings.HasPrefix(line, "file:") {\n\t\t\tcontinue\n\t\t}\n\t\torigin := line[len("file:"):]\n\t\tif i := strings.IndexAny(origin, " \\t"); i >= 0 {\n\t\t\torigin = origin[:i]\n\t\t}\n\t\tif origin == "" {\n\t\t\tcontinue\n\t\t}\n\t\tactual, err := filepath.Abs(origin)\n\t\tif err != nil {\n\t\t\treturn fmt.Errorf("resolve Git config origin: %w", err)\n\t\t}\n\t\tif configured == actual {\n\t\t\treturn fmt.Errorf("git target is an active Git configuration source")\n\t\t}\n\t}\n\treturn nil\n}\n\nfunc rejectGrafts(ctx context.Context, target Target) error {'''),
          ('''\toutput, err := runGit(ctx, target.Repository, "check-attr", "-z", "text", "eol", "ident", "working-tree-encoding", "--", target.Path)\n''', '''\toutput, err := runGit(ctx, target.Repository, "check-attr", "-z", "text", "eol", "ident", "working-tree-encoding", "crlf", "--", target.Path)\n'''),
          ('''\tif len(parts) != 12 || parts[0] != target.Path {''', '''\tif len(parts) != 15 || parts[0] != target.Path {'''),
          ('''\t\tparts[10]: parts[11],\n\t}''', '''\t\tparts[10]: parts[11],\n\t\tparts[13]: parts[14],\n\t}'''),
          ('''\tif values["working-tree-encoding"] != "unspecified" && values["working-tree-encoding"] != "unset" {\n\t\treturn fmt.Errorf("git target uses working-tree-encoding; encoded targets are not supported")\n\t}\n\treturn nil\n}''', '''\tif values["working-tree-encoding"] != "unspecified" && values["working-tree-encoding"] != "unset" {\n\t\treturn fmt.Errorf("git target uses working-tree-encoding; encoded targets are not supported")\n\t}\n\tif values["crlf"] != "unspecified" && values["crlf"] != "unset" {\n\t\treturn fmt.Errorf("git target uses the legacy crlf attribute; normalized targets are not supported")\n\t}\n\treturn nil\n}'''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('provider replacement not found')
              s = s.replace(old, new, 1)
          p.write_text(s)

          tp = Path('integrations/git/current_findings_test.go')
          t = tp.read_text()
          addition = '''
func TestRejectGitConfigTargetRejectsActiveGitConfigInclude(t *testing.T) {
\ttarget, _, _, _, _ := newTestProvider(t, "initial")
\tconfigPath := filepath.Join(target.Repository, "tracked-config.inc")
\tif err := os.WriteFile(configPath, []byte("[core]\\n\\tattributesFile = /tmp/unused\\n"), 0o644); err != nil {
\t\tt.Fatal(err)
\t}
\tgitTest(t, target.Repository, "add", "--", "tracked-config.inc")
\tgitTest(t, target.Repository, "commit", "-m", "add tracked config include")
\tgitTest(t, target.Repository, "config", "include.path", "../tracked-config.inc")

\terr := rejectGitConfigTarget(context.Background(), target)
\tif err == nil || !strings.Contains(err.Error(), "configuration source") {
\t\tt.Fatalf("error = %v, want active Git configuration source rejection", err)
\t}
}

func TestRejectConfiguredNormalizationRejectsLegacyCRLF(t *testing.T) {
\ttarget, _, _, _, _ := newTestProvider(t, "initial")
\tif err := os.WriteFile(filepath.Join(target.Repository, ".gitattributes"), []byte(target.Path+" crlf\\n"), 0o644); err != nil {
\t\tt.Fatal(err)
\t}
\tgitTest(t, target.Repository, "add", "--", ".gitattributes")
\tgitTest(t, target.Repository, "commit", "-m", "configure legacy crlf normalization")

\terr := rejectConfiguredNormalization(context.Background(), target)
\tif err == nil || !strings.Contains(err.Error(), "crlf") {
\t\tt.Fatalf("error = %v, want legacy crlf rejection", err)
\t}
}
'''
          marker = '\nfunc TestRejectConfiguredNormalizationRejectsIdent'
          if 'TestRejectGitConfigTargetRejectsActiveGitConfigInclude' not in t:
              if marker not in t:
                  raise SystemExit('test insertion marker not found')
              t = t.replace(marker, addition + marker, 1)
          tp.write_text(t)
          PY
          gofmt -w integrations/git/provider.go integrations/git/current_findings_test.go
          git diff --check
          git status --short
          git add integrations/git/provider.go integrations/git/current_findings_test.go .github/workflows/ci.yml
          git checkout -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml
          git commit -m 'fix: reject config sources and legacy crlf targets'
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Validate agent integrations
        run: |
          test -f .claude-plugin/plugin.json
          test -f skills/control/SKILL.md
          test -f skills/ackos-control/SKILL.md
          test -f gemini-extension.json
          test -f GEMINI.md
          test -f integrations/chatgpt/SKILL.md
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool gemini-extension.json >/dev/null
          grep -q '^description:' skills/control/SKILL.md
          grep -q '^description:' skills/ackos-control/SKILL.md
          grep -q '^description:' integrations/chatgpt/SKILL.md
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
