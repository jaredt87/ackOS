name: PR10 Fix Test

on:
  push:
    branches: [feat/phase2-git-provider]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct config-source regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/current_findings_test.go')
          s = p.read_text()
          old = '''\ttarget, _, _, _, _ := newTestProvider(t, "initial")\n\tconfigPath := filepath.Join(target.Repository, "tracked-config.inc")\n\tif err := os.WriteFile(configPath, []byte("[core]\\n\\tattributesFile = /tmp/unused\\n"), 0o644); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgitTest(t, target.Repository, "add", "--", "tracked-config.inc")\n\tgitTest(t, target.Repository, "commit", "-m", "add tracked config include")\n\tgitTest(t, target.Repository, "config", "include.path", "../tracked-config.inc")\n\n\terr := rejectGitConfigTarget(context.Background(), target)\n'''
          new = '''\ttarget, _, _, _, _ := newTestProvider(t, "initial")\n\tconfigPath := filepath.Join(target.Repository, "tracked-config.inc")\n\tif err := os.WriteFile(configPath, []byte("[core]\\n\\tattributesFile = /tmp/unused\\n"), 0o644); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgitTest(t, target.Repository, "add", "--", "tracked-config.inc")\n\tgitTest(t, target.Repository, "commit", "-m", "add tracked config include")\n\tgitTest(t, target.Repository, "config", "include.path", "../tracked-config.inc")\n\tconfigTarget, err := NewTarget(target.Repository, "tracked-config.inc", "test-repo:tracked-config.inc")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\n\terr = rejectGitConfigTarget(context.Background(), configTarget)\n'''
          if old not in s:
              raise SystemExit('test replacement point not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm integrations/git/config_debug_test.go
          gofmt -w integrations/git/current_findings_test.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/git/current_findings_test.go integrations/git/config_debug_test.go
          git commit -m 'fix: bind config-source regression to included target'
          git fetch origin feat/phase2-git-provider
          git rebase origin/feat/phase2-git-provider
          git push origin HEAD:feat/phase2-git-provider
