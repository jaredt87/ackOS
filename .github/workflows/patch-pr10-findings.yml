name: Patch PR10 findings
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'jaredt87'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-git-provider
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          s = s.replace('fields := strings.FieldsN(line, 2)\n\t\t\tif len(fields) != 2 || fields[1] == "" {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tinclude := fields[1]', 'sep = next((i for i, ch in enumerate(line) if ch in " \\t"), -1)\n\t\t\tif sep < 0 {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tinclude = line[sep:].strip()\n\t\t\tif not include:\n\t\t\t\tcontinue', 1)
          s = s.replace('if err := verifyLatestCommit(v, ctx, t, authority.ExecutionID); err != nil {', 'if _, err := verifyLatestCommit(v, ctx, t, authority.ExecutionID); err != nil {', 1)
          t = Path('integrations/git/current_findings_test.go')
          ts = t.read_text()
          ts = ts.replace('err := verifyCommitAt(', '_, err := verifyCommitAt(')
          t.write_text(ts)
          p.write_text(s)
          PY
          gofmt -w integrations/git/provider.go integrations/git/current_findings_test.go
          go test ./integrations/git
      - name: Commit fixes
        run: |
          git config user.name 'ackOS automation'
          git config user.email 'ackos-automation@example.invalid'
          git add integrations/git/provider.go integrations/git/current_findings_test.go
          git diff --cached --quiet && exit 0
          git commit -m 'fix: address latest PR10 review findings'
          git push origin HEAD:feat/phase2-git-provider
