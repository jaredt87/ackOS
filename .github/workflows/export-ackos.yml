name: Export ackOS ZIP
on:
  push:
    branches:
      - feat/phase2-git-provider
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: zip -r ackOS-feat-phase2-git-provider.zip . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: ackOS-feat-phase2-git-provider
          path: ackOS-feat-phase2-git-provider.zip
