name: Fix PR 10 test

on:
  push:
    branches:
      - feat/phase2-git-provider

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-git-provider
          fetch-depth: 0
      - name: Fix merge test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider_test.go')
          s = p.read_text()
          old = '\tgitTest(t, target.Repository, "checkout", "main")\n'
          new = '\tgitTest(t, target.Repository, "checkout", "-")\n'
          if old not in s:
              raise SystemExit('merge test branch checkout not found')
          p.write_text(s.replace(old, new, 1))
          PY
          gofmt -w integrations/git/provider_test.go
          rm -f .github/workflows/fix-pr10-test.yml PR10_CI_TRIGGER
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/git/provider_test.go .github/workflows/fix-pr10-test.yml PR10_CI_TRIGGER
          git commit -m "fix: make pending merge regression branch agnostic"
          git push origin HEAD:feat/phase2-git-provider
