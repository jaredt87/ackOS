name: PR10 security fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-git-provider
          fetch-depth: 0
      - name: Apply fixes and regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('integrations/git/provider.go')
          s = p.read_text()

          s = s.replace('''\tif status != "" {\n\t\treturn fail(fmt.Errorf("git worktree is not clean"))\n\t}\n\tif err := rejectAttributesTarget(ctx, e.Target); err != nil {''', '''\tif status != "" {\n\t\treturn fail(fmt.Errorf("git worktree is not clean"))\n\t}\n\tif err := rejectConfiguredFilters(ctx, e.Target); err != nil {\n\t\treturn fail(err)\n\t}\n\tif err := rejectAttributesTarget(ctx, e.Target); err != nil {''')

          s = s.replace('''\tif err := v.requireTracked(ctx); err != nil {\n\t\treturn kernel.Observation{}, err\n\t}\n\tcontent, err := v.read(ctx)''', '''\tif err := v.requireTracked(ctx); err != nil {\n\t\treturn kernel.Observation{}, err\n\t}\n\tif err := rejectConfiguredFilters(ctx, v.Target); err != nil {\n\t\treturn kernel.Observation{}, err\n\t}\n\tcontent, err := v.read(ctx)''')

          s = s.replace('''\tbeforeHash, err := gitFilteredBlobHash(ctx, e.Target, t.Before)''', '''\tbeforeHash, err := gitBlobHash(ctx, e.Target, t.Before)''')
          s = s.replace('''\tafterHash, err := gitFilteredBlobHash(ctx, e.Target, t.After)''', '''\tafterHash, err := gitBlobHash(ctx, e.Target, t.After)''')
          s = s.replace('''\texpectedBeforeHash, err := gitFilteredBlobHash(ctx, target, t.Before)''', '''\texpectedBeforeHash, err := gitBlobHash(ctx, target, t.Before)''')
          s = s.replace('''\texpectedAfterHash, err := gitFilteredBlobHash(ctx, target, t.After)''', '''\texpectedAfterHash, err := gitBlobHash(ctx, target, t.After)''')

          old = '''func gitFilteredBlobHash(ctx context.Context, target Target, content string) (string, error) {\n\ttmp, err := os.CreateTemp("", "ackos-git-filter-*")\n\tif err != nil {\n\t\treturn "", fmt.Errorf("create temporary Git filter input: %w", err)\n\t}\n\tname := tmp.Name()\n\tdefer os.Remove(name)\n\tif _, err := tmp.WriteString(content); err != nil {\n\t\t_ = tmp.Close()\n\t\treturn "", fmt.Errorf("write temporary Git filter input: %w", err)\n\t}\n\tif err := tmp.Close(); err != nil {\n\t\treturn "", fmt.Errorf("close temporary Git filter input: %w", err)\n\t}\n\thash, err := runGit(ctx, target.Repository, "hash-object", "--path="+target.Path, name)\n\tif err != nil {\n\t\treturn "", fmt.Errorf("hash Git-filtered content: %w", err)\n\t}\n\treturn strings.TrimSpace(hash), nil\n}\n'''
          new = '''func rejectConfiguredFilters(ctx context.Context, target Target) error {\n\tattrs, err := targetGitAttr(ctx, target)\n\tif err != nil {\n\t\treturn err\n\t}\n\tif attrs != "unspecified" && attrs != "unset" {\n\t\treturn fmt.Errorf("git target uses a configured clean filter; filtered targets are not supported")\n\t}\n\treturn nil\n}\n\nfunc targetGitAttr(ctx context.Context, target Target) (string, error) {\n\toutput, err := runGit(ctx, target.Repository, "check-attr", "-z", "filter", "--", literalPathspec(target.Path))\n\tif err != nil {\n\t\treturn "", fmt.Errorf("inspect Git clean filter: %w", err)\n\t}\n\tparts := strings.Split(strings.TrimSuffix(output, "\\x00"), "\\x00")\n\tif len(parts) != 3 || parts[0] != target.Path || parts[1] != "filter" {\n\t\treturn "", fmt.Errorf("unexpected Git clean filter metadata")\n\t}\n\treturn parts[2], nil\n}\n\nfunc gitBlobHash(ctx context.Context, target Target, content string) (string, error) {\n\ttmp, err := os.CreateTemp("", "ackos-git-blob-*")\n\tif err != nil {\n\t\treturn "", fmt.Errorf("create temporary Git blob input: %w", err)\n\t}\n\tname := tmp.Name()\n\tdefer os.Remove(name)\n\tif _, err := tmp.WriteString(content); err != nil {\n\t\t_ = tmp.Close()\n\t\treturn "", fmt.Errorf("write temporary Git blob input: %w", err)\n\t}\n\tif err := tmp.Close(); err != nil {\n\t\treturn "", fmt.Errorf("close temporary Git blob input: %w", err)\n\t}\n\thash, err := runGit(ctx, target.Repository, "hash-object", "--no-filters", name)\n\tif err != nil {\n\t\treturn "", fmt.Errorf("hash Git blob content: %w", err)\n\t}\n\treturn strings.TrimSpace(hash), nil\n}\n'''
          if old not in s:
              raise SystemExit('gitFilteredBlobHash block not found')
          s = s.replace(old, new)

          old = '''\tcontent, err := io.ReadAll(file)\n\tif err != nil {\n\t\treturn "", fmt.Errorf("read git file: %w", err)\n\t}\n\tif err := ctx.Err(); err != nil {\n\t\treturn "", err\n\t}\n\treturn string(content), nil\n'''
          new = '''\treadDone := make(chan struct{})\n\tvar content []byte\n\tvar readErr error\n\tgo func() {\n\t\tcontent, readErr = io.ReadAll(file)\n\t\tclose(readDone)\n\t}()\n\tselect {\n\tcase <-readDone:\n\t\tif readErr != nil {\n\t\t\treturn "", fmt.Errorf("read git file: %w", readErr)\n\t\t}\n\tcase <-ctx.Done():\n\t\t_ = file.Close()\n\t\treturn "", ctx.Err()\n\t}\n\tif err := ctx.Err(); err != nil {\n\t\treturn "", err\n\t}\n\treturn string(content), nil\n'''
          if old not in s:
              raise SystemExit('read block not found')
          s = s.replace(old, new)

          old = '''func runGit(ctx context.Context, repository string, args ...string) (string, error) {\n\tcmd := exec.Command("git", args...)'''
          new = '''func runGit(ctx context.Context, repository string, args ...string) (string, error) {\n\tgitArgs := append([]string{"-c", "core.fsmonitor=false"}, args...)\n\tcmd := exec.Command("git", gitArgs...)'''
          if old not in s:
              raise SystemExit('runGit block not found')
          s = s.replace(old, new)

          p.write_text(s)

          tp = Path('integrations/git/provider_test.go')
          ts = tp.read_text()
          marker = 'func TestExecutorRejectsPendingGitMerge(t *testing.T) {'
          test = r'''func TestExecutorRejectsConfiguredCleanFilter(t *testing.T) {\n\ttarget, observer, executor, _, _ := newTestProvider(t, "initial")\n\tmarker := filepath.Join(t.TempDir(), "filter-side-effect")\n\tgitTest(t, target.Repository, "config", "filter.ackos-clean.clean", "sh -c 'echo side-effect >> \\\"$ACKOS_FILTER_MARKER\\\"; cat'")\n\tif err := os.WriteFile(filepath.Join(target.Repository, ".gitattributes"), []byte("docs/example.md filter=ackos-clean\\n"), 0o644); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgitTest(t, target.Repository, "add", ".gitattributes")\n\tgitTest(t, target.Repository, "commit", "-m", "configure clean filter")\n\tt.Setenv("ACKOS_FILTER_MARKER", marker)\n\tobservation, err := observer.Observe(context.Background(), target.Subject)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tresult := executor.Execute(context.Background(), kernel.Transition{Subject: target.Subject, Before: observation.State, After: "updated"}, kernel.Authority{ExecutionID: "attempt-filter"})\n\tif result.Success || !strings.Contains(result.Message, "configured clean filter") {\n\t\tt.Fatalf("result = %+v, want configured-filter rejection", result)\n\t}\n\tif _, err := os.Stat(marker); !os.IsNotExist(err) {\n\t\tt.Fatalf("clean filter produced side effect: %v", err)\n\t}\n\tif got := readTestFile(t, target); got != "initial" {\n\t\tt.Fatalf("target changed during filter rejection: %q", got)\n\t}\n}\n\n'''
          test = test.replace('\\n', '\n')
          if marker not in ts:
              raise SystemExit('test insertion marker not found')
          ts = ts.replace(marker, test + marker, 1)
          tp.write_text(ts)
          PY
          gofmt -w integrations/git/provider.go integrations/git/provider_test.go
          go test ./integrations/git ./integrations/mcp
          git config user.email actions@github.com
          git config user.name github-actions[bot]
          git add integrations/git/provider.go integrations/git/provider_test.go
          if git diff --cached --quiet; then
            echo 'No source changes needed'
            exit 0
          fi
          git commit -m 'fix: harden Git provider filter execution'
          git push origin HEAD:feat/phase2-git-provider
