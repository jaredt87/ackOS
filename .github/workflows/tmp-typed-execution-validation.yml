name: Temporary typed execution validation
on:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final PR HEAD
        uses: actions/checkout@v4
        with:
          ref: 67983d89bd59eb9f2b1c99f1b70ca4e1b893256f9
      - name: Print SHAs
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
      - name: Run new race test
        run: go test -race ./integrations/mcp -run '^TestExecutionErrorValueSkipsHolderReadBeforeCompletion$' -count=1
      - name: Mutation — unconditional holder read
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          p = Path('integrations/mcp/server.go')
          s = p.read_text()
          old = '''if !completed || executionError == nil {
		return nil
	}
	return *executionError'''
          new = 'return *executionError'
          if old not in s:
              raise SystemExit('holder-read mutation target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          set -o pipefail
          go test -race ./integrations/mcp -run '^TestExecutionErrorValueSkipsHolderReadBeforeCompletion$' -count=1 2>&1 | tee /tmp/mutation.log
          status=${PIPESTATUS[0]}
          grep -F -- '--- FAIL: TestExecutionErrorValueSkipsHolderReadBeforeCompletion' /tmp/mutation.log
          grep -F -- 'DATA RACE' /tmp/mutation.log
          if [ "$status" -eq 0 ]; then
            echo 'mutation unexpectedly passed'
            exit 1
          fi
      - name: Restore mutation and verify clean tree
        run: |
          git restore -- integrations/mcp/server.go
          git diff --exit-code
