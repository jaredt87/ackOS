name: PR10 Fix Config3

on:
  push:
    branches: [feat/phase2-git-provider]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply config include fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          old = '''\treturn nil\n}\n\nfunc rejectGrafts(ctx context.Context, target Target) error {'''
          new = '''\tincludes, includeErr := runGit(ctx, target.Repository, "config", "--includes", "--get-regexp", "^include")\n\tif includeErr == nil {\n\t\tfor _, line := range strings.Split(includes, "\\n") {\n\t\t\tfields := strings.SplitN(strings.TrimSpace(line), " ", 2)\n\t\t\tif len(fields) != 2 {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tinclude := strings.TrimSpace(fields[1])\n\t\t\tif !filepath.IsAbs(include) {\n\t\t\t\tinclude = filepath.Join(target.Repository, ".git", include)\n\t\t\t}\n\t\t\tinclude, resolveErr := filepath.Abs(include)\n\t\t\tif resolveErr != nil {\n\t\t\t\treturn fmt.Errorf("resolve Git include: %w", resolveErr)\n\t\t\t}\n\t\t\tif include == configured {\n\t\t\t\treturn fmt.Errorf("git target is an active Git configuration source")\n\t\t\t}\n\t\t}\n\t}\n\treturn nil\n}\n\nfunc rejectGrafts(ctx context.Context, target Target) error {'''
          if old not in s:
              raise SystemExit('fallback insertion point not found')
          p.write_text(s.replace(old, new, 1))
          PY
          gofmt -w integrations/git/provider.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/git/provider.go
          git commit -m 'fix: detect active local Git includes'
          git push
