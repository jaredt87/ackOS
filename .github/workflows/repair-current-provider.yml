name: repair-current-provider
on:
  push:
    branches: [feat/phase2-git-provider]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-git-provider
      - name: Restore provider and apply rollback fix
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          path = Path('integrations/git/provider.go')
          subprocess.run(['git', 'checkout', '7abb8031fb05c492ec7f865cbb996c2090b248ee', '--', str(path)], check=True)
          text = path.read_text()
          old = '''\texchangedFD, err := syscall.Openat(parentFD, tmpName, syscall.O_RDONLY|syscall.O_NOFOLLOW, 0)\n\tif err != nil {\n\t\treturn fmt.Errorf("open exchanged git target: %w", err)\n\t}\n\texchangedFile := os.NewFile(uintptr(exchangedFD), filepath.Join(filepath.Dir(path), tmpName))\n\tif exchangedFile == nil {\n\t\t_ = syscall.Close(exchangedFD)\n\t\treturn fmt.Errorf("open exchanged git target: invalid file descriptor")\n\t}\n'''
          new = '''\trollback := func(cause error) error {\n\t\tif rollbackErr := rollbackExchangedTarget(parentFD, tmpName, name, fd, stat, &preparedStat); rollbackErr != nil {\n\t\t\treturn fmt.Errorf("%v (rollback: %v)", cause, rollbackErr)\n\t\t}\n\t\treturn cause\n\t}\n\texchangedFD, err := syscall.Openat(parentFD, tmpName, syscall.O_RDONLY|syscall.O_NOFOLLOW, 0)\n\tif err != nil {\n\t\treturn rollback(fmt.Errorf("open exchanged git target: %w", err))\n\t}\n\texchangedFile := os.NewFile(uintptr(exchangedFD), filepath.Join(filepath.Dir(path), tmpName))\n\tif exchangedFile == nil {\n\t\t_ = syscall.Close(exchangedFD)\n\t\treturn rollback(fmt.Errorf("open exchanged git target: invalid file descriptor"))\n\t}\n'''
          if old not in text:
              raise SystemExit('provider repair anchor not found')
          path.write_text(text.replace(old, new, 1))
          subprocess.run(['git', 'rm', '.github/workflows/repair-current-provider.yml'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'integrations/git/provider.go'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: roll back every post-exchange open failure'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:feat/phase2-git-provider'], check=True)
