name: PR10 remaining hardening

on:
  push:
    branches: [fix/pr10-codex-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'apply remaining PR10 fixes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr10-codex-hardening
      - name: Apply remaining fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('integrations/git/provider.go')
          s = p.read_text()

          # Make all target reads walk anchored, non-symlinked parent descriptors.
          old = '''func readFile(ctx context.Context, target Target) (string, error) {
\tif err := ctx.Err(); err != nil {
\t\treturn "", err
\t}
\tpath := filepath.Join(target.Repository, target.Path)
\tfd, err := syscall.Open(path, syscall.O_RDONLY|syscall.O_NONBLOCK|syscall.O_NOFOLLOW, 0)
\tif err != nil {
\t\treturn "", fmt.Errorf("open git file: %w", err)
\t}
\tfile := os.NewFile(uintptr(fd), path)
\tif file == nil {
\t\t_ = syscall.Close(fd)
\t\treturn "", fmt.Errorf("open git file: invalid file descriptor")
\t}
\tdefer file.Close()
\tinfo, err := file.Stat()
\tif err != nil {
\t\treturn "", fmt.Errorf("stat git file: %w", err)
\t}
\tif !info.Mode().IsRegular() {
\t\treturn "", fmt.Errorf("git target is not a regular file")
\t}
\tif stat, ok := info.Sys().(*syscall.Stat_t); ok && stat.Nlink > 1 {
\t\treturn "", fmt.Errorf("git target has multiple hard links")
\t}
\treadDone := make(chan struct{})
\tvar content []byte
\tvar readErr error
\tgo func() {
\t\tcontent, readErr = io.ReadAll(file)
\t\tclose(readDone)
\t}()
\tselect {
\tcase <-readDone:
\t\tif readErr != nil {
\t\t\treturn "", fmt.Errorf("read git file: %w", readErr)
\t\t}
\tcase <-ctx.Done():
\t\t_ = file.Close()
\t\treturn "", ctx.Err()
\t}
\tif err := ctx.Err(); err != nil {
\t\treturn "", err
\t}
\treturn string(content), nil
}'''
          new = '''func readFile(ctx context.Context, target Target) (string, error) {
\tif err := ctx.Err(); err != nil {
\t\treturn "", err
\t}
\tparentFD, err := openParentDirNoSymlink(target)
\tif err != nil {
\t\treturn "", err
\t}
\tdefer syscall.Close(parentFD)
\tname := filepath.Base(filepath.Clean(target.Path))
\tfd, err := syscall.Openat(parentFD, name, syscall.O_RDONLY|syscall.O_NONBLOCK|syscall.O_NOFOLLOW, 0)
\tif err != nil {
\t\treturn "", fmt.Errorf("open git file: %w", err)
\t}
\tfile := os.NewFile(uintptr(fd), filepath.Join(target.Repository, target.Path))
\tif file == nil {
\t\t_ = syscall.Close(fd)
\t\treturn "", fmt.Errorf("open git file: invalid file descriptor")
\t}
\tdefer file.Close()
\tinfo, err := file.Stat()
\tif err != nil {
\t\treturn "", fmt.Errorf("stat git file: %w", err)
\t}
\tif !info.Mode().IsRegular() {
\t\treturn "", fmt.Errorf("git target is not a regular file")
\t}
\tif stat, ok := info.Sys().(*syscall.Stat_t); ok && stat.Nlink > 1 {
\t\treturn "", fmt.Errorf("git target has multiple hard links")
\t}
\treadDone := make(chan struct{})
\tvar content []byte
\tvar readErr error
\tgo func() {
\t\tcontent, readErr = io.ReadAll(file)
\t\tclose(readDone)
\t}()
\tselect {
\tcase <-readDone:
\t\tif readErr != nil {
\t\t\treturn "", fmt.Errorf("read git file: %w", readErr)
\t\t}
\tcase <-ctx.Done():
\t\t_ = file.Close()
\t\treturn "", ctx.Err()
\t}
\tif err := ctx.Err(); err != nil {
\t\treturn "", err
\t}
\treturn string(content), nil
}'''
          if old not in s:
              raise SystemExit('readFile pattern not found')
          s = s.replace(old, new, 1)

          # Pin verifier final HEAD to the commit actually inspected.
          old = '''func verifyLatestCommit(v Verifier, ctx context.Context, t kernel.Transition, executionID string) error {
\treturn verifyCommitAt(ctx, v.Target, func(args ...string) (string, error) { return v.git(ctx, args...) }, "", t, executionID)
}

func verifyCommitAt(ctx context.Context, target Target, git func(...string) (string, error), expectedParent string, t kernel.Transition, executionID string) error {'''
          new = '''func verifyLatestCommit(v Verifier, ctx context.Context, t kernel.Transition, executionID string) (string, error) {
\treturn verifyCommitAt(ctx, v.Target, func(args ...string) (string, error) { return v.git(ctx, args...) }, "", t, executionID)
}

func verifyCommitAt(ctx context.Context, target Target, git func(...string) (string, error), expectedParent string, t kernel.Transition, executionID string) (string, error) {'''
          if old not in s:
              raise SystemExit('verify signature not found')
          s = s.replace(old, new, 1)
          start = s.index('func verifyCommitAt(')
          end = s.index('\nfunc (e Executor) requireTracked', start)
          fn = s[start:end]
          fn = fn.replace('return fmt.Errorf(', 'return "", fmt.Errorf(')
          if '\treturn nil\n}' not in fn:
              raise SystemExit('verify final return not found')
          fn = fn.replace('\treturn nil\n}', '\treturn head, nil\n}', 1)
          s = s[:start] + fn + s[end:]
          s = s.replace('''\tif err := verifyCommit(e, ctx, head, t, authority.ExecutionID); err != nil {''','''\tif _, err := verifyCommit(e, ctx, head, t, authority.ExecutionID); err != nil {''',1)
          old = '''\tif err := verifyLatestCommit(v, ctx, t, authority.ExecutionID); err != nil {
\t\treturn kernel.Observation{}, err
\t}
\tverifiedHead, err := v.git(ctx, "rev-parse", "HEAD")
\tif err != nil {
\t\treturn kernel.Observation{}, fmt.Errorf("re-read verified Git HEAD: %w", err)
\t}'''
          new = '''\tverifiedHead, err := verifyLatestCommit(v, ctx, t, authority.ExecutionID)
\tif err != nil {
\t\treturn kernel.Observation{}, err
\t}'''
          if old not in s:
              raise SystemExit('verifier latest commit block not found')
          s = s.replace(old, new, 1)

          # Reject info/attributes aliases and parse recursive includes with Git's whitespace delimiter.
          marker = '''\tif configuredResolved == actualResolved {
\t\treturn fmt.Errorf("git target is configured as the active attributes file")
\t}
\treturn nil
}

func rejectGitConfigTarget'''
          replacement = '''\tif configuredResolved == actualResolved {
\t\treturn fmt.Errorf("git target is configured as the active attributes file")
\t}
\tinfoAttrs := filepath.Join(target.Repository, ".git", "info", "attributes")
\tinfoAttrsResolved, err := filepath.EvalSymlinks(infoAttrs)
\tif err == nil {
\t\tinfoAttrsResolved, err = filepath.Abs(infoAttrsResolved)
\t\tif err != nil {
\t\t\treturn fmt.Errorf("resolve Git info attributes identity path: %w", err)
\t\t}
\t\tif infoAttrsResolved == configuredResolved {
\t\t\treturn fmt.Errorf("git target is configured as the active info/attributes file")
\t\t}
\t} else if !os.IsNotExist(err) {
\t\treturn fmt.Errorf("resolve Git info attributes identity: %w", err)
\t}
\treturn nil
}

func rejectGitConfigTarget'''
          if marker not in s:
              raise SystemExit('attributes insertion marker not found')
          s=s.replace(marker,replacement,1)

          old = '''\t\tfor _, line := range strings.Split(includeOutput, "\\n") {
\t\t\tline = strings.TrimSpace(line)
\t\t\tif line == "" {
\t\t\t\tcontinue
\t\t\t}
\t\t\t_, include, ok := strings.Cut(line, "\\t")
\t\t\tif !ok || include == "" {
\t\t\t\tcontinue
\t\t\t}
\t\t\tif !filepath.IsAbs(include) {
\t\t\t\tinclude = filepath.Join(filepath.Dir(resolvedSource), include)
\t\t\t}
\t\t\taddSource(include)
\t\t}'''
          new = '''\t\tfor _, line := range strings.Split(includeOutput, "\\n") {
\t\t\tline = strings.TrimSpace(line)
\t\t\tif line == "" {
\t\t\t\tcontinue
\t\t\t}
\t\t\tidx := strings.IndexAny(line, " \\t")
\t\t\tif idx < 0 {
\t\t\t\tcontinue
\t\t\t}
\t\t\tinclude := strings.TrimSpace(line[idx+1:])
\t\t\tif include == "" {
\t\t\t\tcontinue
\t\t\t}
\t\t\tif !filepath.IsAbs(include) {
\t\t\t\tinclude = filepath.Join(filepath.Dir(resolvedSource), include)
\t\t\t}
\t\t\taddSource(include)
\t\t}'''
          if old not in s:
              raise SystemExit('include parser pattern not found')
          s=s.replace(old,new,1)

          # Reject empty tracked files before constructing kernel observations.
          marker='''\tif err := validateNoSymlinks(target); err != nil {
\t\treturn Target{}, err
\t}
\treturn target, nil
}'''
          replacement='''\tif err := validateNoSymlinks(target); err != nil {
\t\treturn Target{}, err
\t}
\tcontent, err := readFile(context.Background(), target)
\tif err != nil {
\t\treturn Target{}, err
\t}
\tif content == "" {
\t\treturn Target{}, fmt.Errorf("git target must not be empty")
\t}
\treturn target, nil
}'''
          if marker not in s:
              raise SystemExit('NewTarget marker not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s)

          t=Path('integrations/git/provider_test.go')
          ts=t.read_text()
          empty='''\nfunc TestNewTargetRejectsEmptyFile(t *testing.T) {\n\tdir := t.TempDir()\n\tgitTest(t, dir, "init")\n\tgitTest(t, dir, "config", "user.email", "ackos-test@example.invalid")\n\tgitTest(t, dir, "config", "user.name", "ackOS test")\n\tpath := filepath.Join(dir, "empty.txt")\n\tif err := os.WriteFile(path, nil, 0o644); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgitTest(t, dir, "add", "--", "empty.txt")\n\tgitTest(t, dir, "commit", "-m", "initial")\n\tif _, err := NewTarget(dir, "empty.txt", "repo:empty.txt"); err == nil || !strings.Contains(err.Error(), "must not be empty") {\n\t\tt.Fatalf("NewTarget error = %v, want empty-target rejection", err)\n\t}\n}\n'''
          marker='\nfunc TestNewTargetRejectsPathTraversal'
          if marker not in ts:
              raise SystemExit('empty test marker not found')
          ts=ts.replace(marker,empty+marker,1)
          t.write_text(ts)

          Path('.github/workflows/pr10-remaining-hardening.yml').unlink(missing_ok=True)
          PY
      - name: Format and test
        run: |
          gofmt -w integrations/git/provider.go integrations/git/provider_test.go
          go test ./...
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/git/provider.go integrations/git/provider_test.go .github/workflows/pr10-remaining-hardening.yml
          git commit -m 'fix: apply remaining PR10 fixes'
          git push origin HEAD:fix/pr10-codex-hardening
