name: PR10 Filter Fix

on:
  push:
    branches: [feat/phase2-git-provider]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Patch provider and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          needle = '''\tif current != t.Before {\n\t\treturn kernel.ExecutionResult{Message: "git file changed at mutation boundary"}\n\t}\n\tif err := os.WriteFile(filepath.Join(e.Target.Repository, e.Target.Path), []byte(t.After), 0o644); err != nil {'''
          replacement = '''\tif current != t.Before {\n\t\treturn kernel.ExecutionResult{Message: "git file changed at mutation boundary"}\n\t}\n\texpectedBeforeHash, err := gitFilteredBlobHash(ctx, e.Target, t.Before)\n\tif err != nil {\n\t\treturn kernel.ExecutionResult{Message: fmt.Sprintf("normalize authorized Git parent state: %v", err)}\n\t}\n\texpectedAfterHash, err := gitFilteredBlobHash(ctx, e.Target, t.After)\n\tif err != nil {\n\t\treturn kernel.ExecutionResult{Message: fmt.Sprintf("normalize authorized Git target state: %v", err)}\n\t}\n\tif expectedBeforeHash == expectedAfterHash {\n\t\treturn kernel.ExecutionResult{Message: "authorized Git transition is not representable after clean filtering"}\n\t}\n\tif err := os.WriteFile(filepath.Join(e.Target.Repository, e.Target.Path), []byte(t.After), 0o644); err != nil {'''
          if needle not in s:
              raise SystemExit('mutation insertion point not found')
          p.write_text(s.replace(needle, replacement, 1))

          p = Path('integrations/git/provider_test.go')
          s = p.read_text()
          marker = 'func TestExecutorRejectsResourceSubstitution(t *testing.T) {'
          test = r'''func TestExecutorRejectsFilterEquivalentTransitionBeforeWriting(t *testing.T) {
\tdir := t.TempDir()
\tgitTest(t, dir, "init")
\tgitTest(t, dir, "config", "user.email", "ackos-test@example.invalid")
\tgitTest(t, dir, "config", "user.name", "ackOS test")
\tpath := filepath.Join(dir, "target.txt")
\tif err := os.WriteFile(filepath.Join(dir, ".gitattributes"), []byte("target.txt text eol=lf\\n"), 0o644); err != nil {
\t\tt.Fatal(err)
\t}
\tif err := os.WriteFile(path, []byte("initial\\n"), 0o644); err != nil {
\t\tt.Fatal(err)
\t}
\tgitTest(t, dir, "add", "--", ".gitattributes", "target.txt")
\tgitTest(t, dir, "commit", "-m", "initial")
\ttarget, err := NewTarget(dir, "target.txt", "test-repo:target.txt")
\tif err != nil {
\t\tt.Fatal(err)
\t}
\ttransition := kernel.Transition{Subject: target.Subject, Before: "initial\\n", After: "initial\\r\\n"}
\tresult := (Executor{Target: target}).Execute(context.Background(), transition, kernel.Authority{ExecutionID: "attempt-filter-noop"})
\tif result.Success || !strings.Contains(result.Message, "not representable") {
\t\tt.Fatalf("result = %+v, want filter-equivalent rejection", result)
\t}
\tif got := readTestFile(t, target); got != "initial\\n" {
\t\tt.Fatalf("target mutated before filter-equivalent rejection: %q", got)
\t}
}

'''
          if marker not in s:
              raise SystemExit('test insertion point not found')
          p.write_text(s.replace(marker, test + marker, 1))
          PY
      - name: Format
        run: gofmt -w integrations/git/provider.go integrations/git/provider_test.go
      - name: Test
        run: go test ./...
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/git/provider.go integrations/git/provider_test.go
          git commit -m 'fix: reject filtered no-op Git transitions' || exit 0
          git push
