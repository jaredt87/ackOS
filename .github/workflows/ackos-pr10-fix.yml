name: PR10 Fix

on:
  push:
    branches: [feat/phase2-git-provider]

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/feat/phase2-git-provider'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Fix index parsing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          s = s.replace('strings.TrimSuffix(strings.TrimPrefix(stageable[1:], " "), "\\x00")', 'strings.TrimSuffix(stageable[1:], "\\x00")')
          p.write_text(s)
          PY
      - name: Format
        run: gofmt -w integrations/git/provider.go
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/git/provider.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: format Git provider and parse index paths correctly'
          git push