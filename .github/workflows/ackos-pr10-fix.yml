name: PR10 Fix

on:
  push:
    branches: [feat/phase2-git-provider]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix index parsing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          old = 'stagePath := strings.TrimSuffix(stageable[1:], "\\x00")'
          new = 'stagePath := parseIndexPath(stageable)'
          s = s.replace(old, new)
          marker = 'func exactNULPathList(output, expected string) bool {'
          helper = '''func parseIndexPath(output string) string {\n\tentry := strings.TrimSuffix(output, "\\x00")\n\tif len(entry) < 2 || entry[1] != ' ' {\n\t\treturn ""\n\t}\n\treturn entry[2:]\n}\n\n'''
          s = s.replace(marker, helper + marker)
          p.write_text(s)
          PY
      - name: Format
        run: gofmt -w integrations/git/provider.go
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/git/provider.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: parse Git index status with NUL-safe boundaries'
          git push