name: PR10 hardening

on:
  push:
    branches:
      - feat/phase2-git-provider

permissions:
  contents: write

jobs:
  harden:
    if: github.actor == 'jaredt87'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-git-provider
          fetch-depth: 0
      - name: Apply metadata hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          if 'func rejectUnpreservableMetadata(' in s:
              raise SystemExit(0)
          old = '''func atomicWriteTarget(target Target, content []byte) error {
\tpath := filepath.Join(target.Repository, target.Path)
\tdir := filepath.Dir(path)
\tmode := os.FileMode(0o644)
\tif info, err := os.Stat(path); err == nil {
\t\tmode = info.Mode()
\t}
'''
          new = '''func atomicWriteTarget(target Target, content []byte) error {
\tpath := filepath.Join(target.Repository, target.Path)
\tdir := filepath.Dir(path)
\tmode := os.FileMode(0o644)
\tif info, err := os.Stat(path); err == nil {
\t\tif err := rejectUnpreservableMetadata(path, info); err != nil {
\t\t\treturn err
\t\t}
\t\tmode = info.Mode()
\t}
'''
          if old not in s: raise SystemExit('atomic write block not found')
          s = s.replace(old, new, 1)
          marker = 'func requireCommitIdentity(ctx context.Context, target Target) error {'
          helper = '''func rejectUnpreservableMetadata(path string, info os.FileInfo) error {
\tif stat, ok := info.Sys().(*syscall.Stat_t); ok {
\t\tif uint32(os.Geteuid()) != stat.Uid || uint32(os.Getegid()) != stat.Gid {
\t\t\treturn fmt.Errorf("git target ownership cannot be preserved by atomic replacement")
\t\t}
\t}
\tfor size := 256; ; size *= 2 {
\t\tbuf := make([]byte, size)
\t\tn, err := syscall.Listxattr(path, buf)
\t\tif err == syscall.ENOTSUP || err == syscall.EOPNOTSUPP {
\t\t\treturn nil
\t\t}
\t\tif err != nil {
\t\t\treturn fmt.Errorf("inspect git target extended attributes: %w", err)
\t\t}
\t\tif n == 0 {
\t\t\treturn nil
\t\t}
\t\tif n < len(buf) {
\t\t\treturn fmt.Errorf("git target has extended attributes or ACLs that cannot be preserved by atomic replacement")
\t\t}
\t}
}

'''
          if marker not in s: raise SystemExit('metadata marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY
          gofmt -w integrations/git/provider.go
          go test ./...
          go test -race ./...
          git config user.name 'ackOS automation'
          git config user.email 'ackos-automation@example.invalid'
          git rm .github/workflows/pr10-hardening.yml .github/workflows/ackos-pr10-fix.yml
          git add integrations/git/provider.go
          git commit -m 'fix: preserve unsupported file metadata safely'
          git push origin HEAD:feat/phase2-git-provider
