name: ackOS temporary identity fix

on:
  push:
    branches: [feat/phase2-git-provider]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'chore: fix Git commit identity validation')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply identity guard and clean up
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('integrations/git/provider.go')
          text = path.read_text()

          old = '''\tif filepath.Base(e.Target.Path) == ".gitattributes" {\n\t\treturn kernel.ExecutionResult{Message: "git .gitattributes targets are not supported because the target can change its own filter environment"}\n\t}\n\tif err := os.WriteFile(filepath.Join(e.Target.Repository, e.Target.Path), []byte(t.After), 0o644); err != nil {'''
          new = '''\tif strings.EqualFold(filepath.Base(e.Target.Path), ".gitattributes") {\n\t\treturn kernel.ExecutionResult{Message: "git .gitattributes targets are not supported because the target can change its own filter environment"}\n\t}\n\tif err := requireCommitIdentity(ctx, e.Target); err != nil {\n\t\treturn kernel.ExecutionResult{Message: err.Error()}\n\t}\n\tif err := os.WriteFile(filepath.Join(e.Target.Repository, e.Target.Path), []byte(t.After), 0o644); err != nil {'''
          if old not in text:
              raise SystemExit('mutation guard insertion point not found')
          text = text.replace(old, new, 1)

          marker = '''func requireNoInProgressGitOperation(ctx context.Context, target Target) error {'''
          helper = '''func requireCommitIdentity(ctx context.Context, target Target) error {\n\tfor _, identity := range []string{"GIT_AUTHOR_IDENT", "GIT_COMMITTER_IDENT"} {\n\t\tif _, err := runGit(ctx, target.Repository, "var", identity); err != nil {\n\t\t\treturn fmt.Errorf("Git commit identity is not configured: %s: %w", identity, err)\n\t\t}\n\t}\n\treturn nil\n}\n\n'''
          if marker not in text:
              raise SystemExit('helper insertion point not found')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY
          rm .github/workflows/ackos-fix-identity.yml
          git config user.name 'ackOS automation'
          git config user.email 'ackos-automation@example.invalid'
          git add integrations/git/provider.go .github/workflows/ackos-fix-identity.yml
          git commit -m 'chore: fix Git commit identity validation'
          git push origin HEAD:feat/phase2-git-provider
