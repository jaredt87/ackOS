name: Fix PR 10 helper

on:
  push:
    branches:
      - feat/phase2-git-provider

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-git-provider
          fetch-depth: 0
      - name: Fix Git operation path handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          old = '''\t\tif _, err := os.Stat(strings.TrimSpace(path)); err == nil {\n\t\t\treturn fmt.Errorf("Git operation is already in progress: %s", marker)\n\t\t} else if !os.IsNotExist(err) {\n\t\t\treturn fmt.Errorf("inspect Git operation state %s: %w", marker, err)\n\t\t}\n'''
          new = '''\t\tpath = strings.TrimSpace(path)\n\t\tif !filepath.IsAbs(path) {\n\t\t\tpath = filepath.Join(target.Repository, path)\n\t\t}\n\t\tif _, err := os.Stat(path); err == nil {\n\t\t\treturn fmt.Errorf("Git operation is already in progress: %s", marker)\n\t\t} else if !os.IsNotExist(err) {\n\t\t\treturn fmt.Errorf("inspect Git operation state %s: %w", marker, err)\n\t\t}\n'''
          if old not in s:
              raise SystemExit('file marker path block not found')
          s = s.replace(old, new, 1)
          old = '''\t\tif info, err := os.Stat(strings.TrimSpace(path)); err == nil && info.IsDir() {\n\t\t\treturn fmt.Errorf("Git operation is already in progress: %s", marker)\n\t\t} else if err != nil && !os.IsNotExist(err) {\n\t\t\treturn fmt.Errorf("inspect Git operation state %s: %w", marker, err)\n\t\t}\n'''
          new = '''\t\tpath = strings.TrimSpace(path)\n\t\tif !filepath.IsAbs(path) {\n\t\t\tpath = filepath.Join(target.Repository, path)\n\t\t}\n\t\tif info, err := os.Stat(path); err == nil && info.IsDir() {\n\t\t\treturn fmt.Errorf("Git operation is already in progress: %s", marker)\n\t\t} else if err != nil && !os.IsNotExist(err) {\n\t\t\treturn fmt.Errorf("inspect Git operation state %s: %w", marker, err)\n\t\t}\n'''
          if old not in s:
              raise SystemExit('directory marker path block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gofmt -w integrations/git/provider.go
          rm -f .github/workflows/fix-pr10-helper.yml PR10_CI_TRIGGER
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/git/provider.go .github/workflows/fix-pr10-helper.yml PR10_CI_TRIGGER
          git commit -m "fix: resolve Git operation markers relative to repository"
          git push origin HEAD:feat/phase2-git-provider
