name: PR10 security fix retry

on:
  push:
    branches: [feat/phase2-git-provider]
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/feat/phase2-git-provider' || github.event.pull_request.number == 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-git-provider
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('integrations/git/provider.go')
          s = p.read_text()
          s = s.replace('''\tif status != "" {\n\t\treturn fail(fmt.Errorf("git worktree is not clean"))\n\t}\n\tif err := rejectAttributesTarget(ctx, e.Target); err != nil {''', '''\tif status != "" {\n\t\treturn fail(fmt.Errorf("git worktree is not clean"))\n\t}\n\tif err := rejectConfiguredFilters(ctx, e.Target); err != nil {\n\t\treturn fail(err)\n\t}\n\tif err := rejectAttributesTarget(ctx, e.Target); err != nil {''')
          s = s.replace('''\tif err := v.requireTracked(ctx); err != nil {\n\t\treturn kernel.Observation{}, err\n\t}\n\tcontent, err := v.read(ctx)''', '''\tif err := v.requireTracked(ctx); err != nil {\n\t\treturn kernel.Observation{}, err\n\t}\n\tif err := rejectConfiguredFilters(ctx, v.Target); err != nil {\n\t\treturn kernel.Observation{}, err\n\t}\n\tcontent, err := v.read(ctx)''')
          s = s.replace('gitFilteredBlobHash(ctx, e.Target, t.Before)', 'gitBlobHash(ctx, e.Target, t.Before)')
          s = s.replace('gitFilteredBlobHash(ctx, e.Target, t.After)', 'gitBlobHash(ctx, e.Target, t.After)')
          s = s.replace('gitFilteredBlobHash(ctx, target, t.Before)', 'gitBlobHash(ctx, target, t.Before)')
          s = s.replace('gitFilteredBlobHash(ctx, target, t.After)', 'gitBlobHash(ctx, target, t.After)')
          start = s.index('func gitFilteredBlobHash(')
          end = s.index('\nfunc literalPathspec', start)
          replacement = '''func rejectConfiguredFilters(ctx context.Context, target Target) error {
\tattrs, err := targetGitAttr(ctx, target)
\tif err != nil {
\t\treturn err
\t}
\tif attrs != "unspecified" && attrs != "unset" {
\t\treturn fmt.Errorf("git target uses a configured clean filter; filtered targets are not supported")
\t}
\treturn nil
}

func targetGitAttr(ctx context.Context, target Target) (string, error) {
\toutput, err := runGit(ctx, target.Repository, "check-attr", "-z", "filter", "--", literalPathspec(target.Path))
\tif err != nil {
\t\treturn "", fmt.Errorf("inspect Git clean filter: %w", err)
\t}
\tparts := strings.Split(strings.TrimSuffix(output, "\\x00"), "\\x00")
\tif len(parts) != 3 || parts[0] != target.Path || parts[1] != "filter" {
\t\treturn "", fmt.Errorf("unexpected Git clean filter metadata")
\t}
\treturn parts[2], nil
}

func gitBlobHash(ctx context.Context, target Target, content string) (string, error) {
\ttmp, err := os.CreateTemp("", "ackos-git-blob-*")
\tif err != nil {
\t\treturn "", fmt.Errorf("create temporary Git blob input: %w", err)
\t}
\tname := tmp.Name()
\tdefer os.Remove(name)
\tif _, err := tmp.WriteString(content); err != nil {
\t\t_ = tmp.Close()
\t\treturn "", fmt.Errorf("write temporary Git blob input: %w", err)
\t}
\tif err := tmp.Close(); err != nil {
\t\treturn "", fmt.Errorf("close temporary Git blob input: %w", err)
\t}
\thash, err := runGit(ctx, target.Repository, "hash-object", "--no-filters", name)
\tif err != nil {
\t\treturn "", fmt.Errorf("hash Git blob content: %w", err)
\t}
\treturn strings.TrimSpace(hash), nil
}
'''
          s = s[:start] + replacement + s[end:]
          old = '''\tcontent, err := io.ReadAll(file)\n\tif err != nil {\n\t\treturn "", fmt.Errorf("read git file: %w", err)\n\t}\n\tif err := ctx.Err(); err != nil {\n\t\treturn "", err\n\t}\n\treturn string(content), nil\n'''
          new = '''\treadDone := make(chan struct{})\n\tvar content []byte\n\tvar readErr error\n\tgo func() {\n\t\tcontent, readErr = io.ReadAll(file)\n\t\tclose(readDone)\n\t}()\n\tselect {\n\tcase <-readDone:\n\t\tif readErr != nil {\n\t\t\treturn "", fmt.Errorf("read git file: %w", readErr)\n\t\t}\n\tcase <-ctx.Done():\n\t\t_ = file.Close()\n\t\treturn "", ctx.Err()\n\t}\n\tif err := ctx.Err(); err != nil {\n\t\treturn "", err\n\t}\n\treturn string(content), nil\n'''
          if old not in s:
              raise SystemExit('read block not found')
          s = s.replace(old, new)
          s = s.replace('''func runGit(ctx context.Context, repository string, args ...string) (string, error) {\n\tcmd := exec.Command("git", args...)''', '''func runGit(ctx context.Context, repository string, args ...string) (string, error) {\n\tgitArgs := append([]string{"-c", "core.fsmonitor=false"}, args...)\n\tcmd := exec.Command("git", gitArgs...)''')
          p.write_text(s)

          tp = Path('integrations/git/provider_test.go')
          ts = tp.read_text()
          marker = 'func TestExecutorRejectsPendingGitMerge(t *testing.T) {'
          if 'TestExecutorRejectsConfiguredCleanFilter' not in ts:
              test = '''func TestExecutorRejectsConfiguredCleanFilter(t *testing.T) {
\ttarget, observer, executor, _, _ := newTestProvider(t, "initial")
\tmarker := filepath.Join(t.TempDir(), "filter-side-effect")
\tgitTest(t, target.Repository, "config", "filter.ackos-clean.clean", "cat")
\tif err := os.WriteFile(filepath.Join(target.Repository, ".gitattributes"), []byte("docs/example.md filter=ackos-clean\\n"), 0o644); err != nil {
\t\tt.Fatal(err)
\t}
\tgitTest(t, target.Repository, "add", ".gitattributes")
\tgitTest(t, target.Repository, "commit", "-m", "configure clean filter")
\tt.Setenv("ACKOS_FILTER_MARKER", marker)
\tobservation, err := observer.Observe(context.Background(), target.Subject)
\tif err != nil {
\t\tt.Fatal(err)
\t}
\tresult := executor.Execute(context.Background(), kernel.Transition{Subject: target.Subject, Before: observation.State, After: "updated"}, kernel.Authority{ExecutionID: "attempt-filter"})
\tif result.Success || !strings.Contains(result.Message, "configured clean filter") {
\t\tt.Fatalf("result = %+v, want configured-filter rejection", result)
\t}
\tif got := readTestFile(t, target); got != "initial" {
\t\tt.Fatalf("target changed during filter rejection: %q", got)
\t}
}

'''
              ts = ts.replace(marker, test + marker, 1)
              tp.write_text(ts)
          PY
          gofmt -w integrations/git/provider.go integrations/git/provider_test.go
          go test ./integrations/git ./integrations/mcp
          git config user.email actions@github.com
          git config user.name github-actions[bot]
          git add integrations/git/provider.go integrations/git/provider_test.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: harden Git provider filter execution'
          git push origin HEAD:feat/phase2-git-provider
