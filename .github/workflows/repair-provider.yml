name: repair-provider
on:
  push:
    branches: [feat/phase2-git-provider]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syscall stat type
        run: |
          sed -i '/var currentStat syscall\.Stat_t/{s/syscall\.Stat_t/unix.Stat_t/;}' integrations/git/provider.go
          git diff --exit-code -- integrations/git/provider.go || {
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add integrations/git/provider.go
            git commit -m 'fix: use matching unix stat type'
            git push
          }
          # retrigger after workflow installation
