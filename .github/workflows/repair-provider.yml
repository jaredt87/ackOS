name: repair-provider
on:
  push:
    branches: [feat/phase2-git-provider]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syscall API
        run: |
          sed -i 's/syscall\.Fstatat(parentFD, name, currentStat, 0)/unix.Fstatat(parentFD, name, currentStat, 0)/' integrations/git/provider.go
          git diff --exit-code -- integrations/git/provider.go || {
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add integrations/git/provider.go
            git commit -m 'fix: use unix Fstatat for rollback validation'
            git push
          }
