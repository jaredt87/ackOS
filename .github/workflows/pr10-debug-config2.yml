name: PR10 Debug Config2

on:
  push:
    branches: [feat/phase2-git-provider]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make diagnostics visible
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/current_findings_test.go')
          s = p.read_text()
          old = '''\tif err == nil || !strings.Contains(err.Error(), "configuration source") {\n\t\tt.Fatalf("error = %v, want active Git configuration source rejection", err)\n\t}\n'''
          new = '''\tif err == nil || !strings.Contains(err.Error(), "configuration source") {\n\t\tt.Fatalf("error = %v, local include config = %q, debug err = %v, want active Git configuration source rejection", err, debugConfig, debugErr)\n\t}\n'''
          if old not in s:
              raise SystemExit('diagnostic replacement point not found')
          p.write_text(s.replace(old, new, 1))
          PY
          gofmt -w integrations/git/current_findings_test.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/git/current_findings_test.go
          git commit -m 'test: expose Git config diagnostics'
          git push
