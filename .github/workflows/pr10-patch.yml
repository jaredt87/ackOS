name: PR10 patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-git-provider
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          old = '''func targetGitAttr(ctx context.Context, target Target) (string, error) {
\toutput, err := runGit(ctx, target.Repository, "check-attr", "-z", "filter", "--", literalPathspec(target.Path))
\tif err != nil {
\t\treturn "", fmt.Errorf("inspect Git clean filter: %w", err)
\t}
\tparts := strings.Split(strings.TrimSuffix(output, "\\x00"), "\\x00")
\tif len(parts) != 3 || parts[0] != target.Path || parts[1] != "filter" {
\t\treturn "", fmt.Errorf("unexpected Git clean filter metadata")
\t}
\treturn parts[2], nil
}
'''
          new = '''func targetGitAttr(ctx context.Context, target Target) (string, error) {
\toutput, err := runGit(ctx, target.Repository, "check-attr", "-z", "filter", "--", literalPathspec(target.Path))
\tif err != nil {
\t\treturn "", fmt.Errorf("inspect Git clean filter: %w", err)
\t}
\tparts := strings.Split(strings.Trim(output, "\\x00"), "\\x00")
\tif len(parts) < 3 || parts[len(parts)-2] != "filter" {
\t\treturn "", fmt.Errorf("unexpected Git clean filter metadata")
\t}
\treturn parts[len(parts)-1], nil
}
'''
          if old not in s:
              raise SystemExit('targetGitAttr block not found')
          p.write_text(s.replace(old, new))
          PY
          gofmt -w integrations/git/provider.go
          go test ./integrations/git ./integrations/mcp
          git config user.email actions@github.com
          git config user.name github-actions[bot]
          git add integrations/git/provider.go
          git commit -m 'fix: parse Git filter metadata robustly'
          git push origin HEAD:feat/phase2-git-provider
