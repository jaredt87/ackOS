name: Patch PR10 findings v3
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'jaredt87'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-git-provider
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          old = '''\t\t\t_, include, ok := strings.Cut(line, "\\t")\n\t\t\tif !ok || include == "" {\n\t\t\t\tcontinue\n\t\t\t}\n'''
          new = '''\t\t\tseparator := strings.IndexAny(line, " \\t")\n\t\t\tif separator < 0 {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tinclude := strings.TrimSpace(line[separator:])\n\t\t\tif include == "" {\n\t\t\t\tcontinue\n\t\t\t}\n'''
          if old not in s: raise SystemExit('include parser anchor not found')
          s = s.replace(old, new, 1)

          old = '''func verifyCommit(e Executor, ctx context.Context, parent string, t kernel.Transition, executionID string) error {\n\treturn verifyCommitAt(ctx, e.Target, func(args ...string) (string, error) { return e.git(ctx, args...) }, parent, t, executionID)\n}\n\nfunc verifyLatestCommit(v Verifier, ctx context.Context, t kernel.Transition, executionID string) error {\n\treturn verifyCommitAt(ctx, v.Target, func(args ...string) (string, error) { return v.git(ctx, args...) }, "", t, executionID)\n}\n'''
          new = '''func verifyCommit(e Executor, ctx context.Context, parent string, t kernel.Transition, executionID string) error {\n\treturn verifyCommitAt(ctx, e.Target, func(args ...string) (string, error) { return e.git(ctx, args...) }, parent, "", t, executionID)\n}\n\nfunc verifyLatestCommit(v Verifier, ctx context.Context, t kernel.Transition, executionID string) (string, error) {\n\thead, err := v.git(ctx, "rev-parse", "HEAD")\n\tif err != nil {\n\t\treturn "", fmt.Errorf("read Git HEAD before verification: %w", err)\n\t}\n\tif err := verifyCommitAt(ctx, v.Target, func(args ...string) (string, error) { return v.git(ctx, args...) }, "", head, t, executionID); err != nil {\n\t\treturn "", err\n\t}\n\treturn head, nil\n}\n'''
          if old not in s: raise SystemExit('verify wrapper anchor not found')
          s = s.replace(old, new, 1)

          old = '''func verifyCommitAt(ctx context.Context, target Target, git func(...string) (string, error), expectedParent string, t kernel.Transition, executionID string) error {\n'''
          new = '''func verifyCommitAt(ctx context.Context, target Target, git func(...string) (string, error), expectedParent string, expectedHead string, t kernel.Transition, executionID string) error {\n'''
          if old not in s: raise SystemExit('verifyCommitAt signature anchor not found')
          s = s.replace(old, new, 1)
          old = '''\thead, err := git("rev-parse", "HEAD")\n\tif err != nil {\n\t\treturn fmt.Errorf("read committed Git HEAD: %w", err)\n\t}\n'''
          new = '''\thead, err := git("rev-parse", "HEAD")\n\tif err != nil {\n\t\treturn fmt.Errorf("read committed Git HEAD: %w", err)\n\t}\n\tif expectedHead != "" && head != expectedHead {\n\t\treturn fmt.Errorf("Git HEAD changed before commit verification")\n\t}\n'''
          if old not in s: raise SystemExit('captured head anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          gofmt -w integrations/git/provider.go
          go test ./integrations/git
      - name: Commit fixes
        run: |
          git config user.name 'ackOS automation'
          git config user.email 'ackos-automation@example.invalid'
          git add integrations/git/provider.go
          git diff --cached --quiet && exit 0
          git commit -m 'fix: close latest PR10 verification gaps'
          git push origin HEAD:feat/phase2-git-provider
