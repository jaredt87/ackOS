# Temporary PR #22 validation. Remove this file before merging.
# pull_request is used with a path filter so the workflow can run from this
# PR branch without relying on workflow_dispatch, which requires the workflow
# to exist on the default branch.

name: PR 22 Temporary Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr22-temporary-validation.yml

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Print tested SHAs
        run: |
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Repeat characterization five times
        run: go test -count=5 ./integrations/mcp -run TestControlExecutionFailureResponseAcrossRecoveryOutcomes

      - name: Mutation 1 — remove provider error capture
        run: |
          sed -i '/result, err := e.provider.Execute(ctx, request)/{n;n;d;}' control/provider_adapters.go

          set +e
          output="$(go test ./control -run 'TestProviderExecutorCapturesExecutionErrors|TestProviderExecutorCapturesProviderTimeoutAfterReturn' 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestProviderExecutorCapturesExecutionErrors/provider_failure'
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestProviderExecutorCapturesProviderTimeoutAfterReturn'

          git checkout -- .
          git diff --exit-code

      - name: Mutation 2 — read timed-out Observe result
        run: |
          sed -i '/func (p invocationProvider) Observe/,/func (p invocationProvider) Execute/ s/return Observation{}, err/return result, err/' control/host.go

          set +e
          output="$(go test -race ./control -run TestInvocationProviderReturnsBeforeReadingTimedOutObserveResult 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestInvocationProviderReturnsBeforeReadingTimedOutObserveResult'
          printf '%s\n' "$output" | grep -F -- 'DATA RACE'

          git checkout -- .
          git diff --exit-code
