name: PR10 one-shot hardening

on:
  push:
    branches: [fix/pr10-codex-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr10-codex-hardening
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('integrations/git/provider.go')
          s=p.read_text()

          old_read=re.search(r'func readFile\(ctx context\.Context, target Target\) \(string, error\) \{.*?\n\}\n\nfunc validateNoSymlinks',s,re.S)
          if not old_read: raise SystemExit('readFile not found')
          new_read='''func readFile(ctx context.Context, target Target) (string, error) {
\tif err := ctx.Err(); err != nil {
\t\treturn "", err
\t}
\tparentFD, err := openParentDirNoSymlink(target)
\tif err != nil {
\t\treturn "", err
\t}
\tdefer syscall.Close(parentFD)
\tname := filepath.Base(filepath.Clean(target.Path))
\tfd, err := syscall.Openat(parentFD, name, syscall.O_RDONLY|syscall.O_NONBLOCK|syscall.O_NOFOLLOW, 0)
\tif err != nil {
\t\treturn "", fmt.Errorf("open git file: %w", err)
\t}
\tfile := os.NewFile(uintptr(fd), filepath.Join(target.Repository, target.Path))
\tif file == nil {
\t\t_ = syscall.Close(fd)
\t\treturn "", fmt.Errorf("open git file: invalid file descriptor")
\t}
\tdefer file.Close()
\tinfo, err := file.Stat()
\tif err != nil {
\t\treturn "", fmt.Errorf("stat git file: %w", err)
\t}
\tif !info.Mode().IsRegular() {
\t\treturn "", fmt.Errorf("git target is not a regular file")
\t}
\tif stat, ok := info.Sys().(*syscall.Stat_t); ok && stat.Nlink > 1 {
\t\treturn "", fmt.Errorf("git target has multiple hard links")
\t}
\treadDone := make(chan struct{})
\tvar content []byte
\tvar readErr error
\tgo func() {
\t\tcontent, readErr = io.ReadAll(file)
\t\tclose(readDone)
\t}()
\tselect {
\tcase <-readDone:
\t\tif readErr != nil {
\t\t\treturn "", fmt.Errorf("read git file: %w", readErr)
\t\t}
\tcase <-ctx.Done():
\t\t_ = file.Close()
\t\treturn "", ctx.Err()
\t}
\tif err := ctx.Err(); err != nil {
\t\treturn "", err
\t}
\treturn string(content), nil
}

func validateNoSymlinks'''
          s=s[:old_read.start()]+new_read+s[old_read.end()-len('func validateNoSymlinks'):]

          # Capture the verified commit object from verifyCommitAt instead of re-reading live HEAD.
          start=s.index('func verifyCommit(e Executor')
          end=s.index('\nfunc (e Executor) requireTracked',start)
          new_verify='''func verifyCommit(e Executor, ctx context.Context, parent string, t kernel.Transition, executionID string) (string, error) {
\treturn verifyCommitAt(ctx, e.Target, func(args ...string) (string, error) { return e.git(ctx, args...) }, parent, t, executionID)
}

func verifyLatestCommit(v Verifier, ctx context.Context, t kernel.Transition, executionID string) (string, error) {
\treturn verifyCommitAt(ctx, v.Target, func(args ...string) (string, error) { return v.git(ctx, args...) }, "", t, executionID)
}

func verifyCommitAt(ctx context.Context, target Target, git func(...string) (string, error), expectedParent string, t kernel.Transition, executionID string) (string, error) {
\tsafeGit := func(args ...string) (string, error) { return git(append([]string{"--no-replace-objects"}, args...)...) }
\thead, err := safeGit("rev-parse", "HEAD")
\tif err != nil {
\t\treturn "", fmt.Errorf("read committed Git HEAD: %w", err)
\t}
\tparents, err := safeGit("rev-list", "--parents", "-n", "1", head)
\tif err != nil {
\t\treturn "", fmt.Errorf("read committed Git parents: %w", err)
\t}
\tfields := strings.Fields(parents)
\tif len(fields) != 2 || fields[0] != head {
\t\treturn "", fmt.Errorf("authorized Git execution did not produce one parent commit")
\t}
\tif expectedParent != "" && fields[1] != expectedParent {
\t\treturn "", fmt.Errorf("authorized Git execution parent changed unexpectedly")
\t}
\tmessage, err := safeGit("log", "-1", "--format=%B", head)
\tif err != nil {
\t\treturn "", fmt.Errorf("read Git commit message: %w", err)
\t}
\tif strings.TrimSpace(message) != "ackOS: execute "+executionID {
\t\treturn "", fmt.Errorf("git execution marker mismatch")
\t}
\tpaths, err := safeGit("diff-tree", "--no-commit-id", "--name-only", "-r", "-z", head)
\tif err != nil {
\t\treturn "", fmt.Errorf("inspect committed Git diff: %w", err)
\t}
\tif !exactNULPathList(paths, target.Path) {
\t\treturn "", fmt.Errorf("committed Git diff contains an unauthorized path")
\t}
\tparentMode, err := gitTreeMode(ctx, target, head+"^")
\tif err != nil {
\t\treturn "", fmt.Errorf("read committed Git parent mode: %w", err)
\t}
\ttargetMode, err := gitTreeMode(ctx, target, head)
\tif err != nil {
\t\treturn "", fmt.Errorf("read committed Git target mode: %w", err)
\t}
\tif parentMode != targetMode {
\t\treturn "", fmt.Errorf("committed Git target mode changed unexpectedly")
\t}
\tbeforeHash, err := safeGit("rev-parse", head+"^:./"+target.Path)
\tif err != nil {
\t\treturn "", fmt.Errorf("read committed Git parent state: %w", err)
\t}
\texpectedBeforeHash, err := gitBlobHash(ctx, target, t.Before)
\tif err != nil {
\t\treturn "", fmt.Errorf("normalize authorized Git parent state: %w", err)
\t}
\tif beforeHash != expectedBeforeHash {
\t\treturn "", fmt.Errorf("committed Git parent does not match authorized state")
\t}
\tafterHash, err := safeGit("rev-parse", head+":./"+target.Path)
\tif err != nil {
\t\treturn "", fmt.Errorf("read committed Git target state: %w", err)
\t}
\texpectedAfterHash, err := gitBlobHash(ctx, target, t.After)
\tif err != nil {
\t\treturn "", fmt.Errorf("normalize authorized Git target state: %w", err)
\t}
\tif afterHash != expectedAfterHash {
\t\treturn "", fmt.Errorf("committed Git target does not match authorized state")
\t}
\treturn head, nil
}
'''
          new_verify=new_verify.replace('''func verifyCommit(e Executor, ctx context.Context, parent string, t kernel.Transition, executionID string) (string, error) {''','''func verifyCommit(e Executor, ctx context.Context, parent string, t kernel.Transition, executionID string) (string, error) {''')
          s=s[:start]+new_verify+s[end:]

          s=s.replace('''\tif _, err := verifyCommit(e, ctx, head, t, authority.ExecutionID); err != nil {''','''\tif _, err := verifyCommit(e, ctx, head, t, authority.ExecutionID); err != nil {''',1)
          old='''\tif err := verifyLatestCommit(v, ctx, t, authority.ExecutionID); err != nil {
\t\treturn kernel.Observation{}, err
\t}
\tverifiedHead, err := v.git(ctx, "rev-parse", "HEAD")
\tif err != nil {
\t\treturn kernel.Observation{}, fmt.Errorf("re-read verified Git HEAD: %w", err)
\t}'''
          new='''\tverifiedHead, err := verifyLatestCommit(v, ctx, t, authority.ExecutionID)
\tif err != nil {
\t\treturn kernel.Observation{}, err
\t}'''
          if old not in s: raise SystemExit('verifier HEAD block not found')
          s=s.replace(old,new,1)

          # Reject info/attributes aliases.
          marker='''\tif configuredResolved == actualResolved {
\t\treturn fmt.Errorf("git target is configured as the active attributes file")
\t}
\treturn nil
}

func rejectGitConfigTarget'''
          repl='''\tif configuredResolved == actualResolved {
\t\treturn fmt.Errorf("git target is configured as the active attributes file")
\t}
\tinfoAttrs := filepath.Join(target.Repository, ".git", "info", "attributes")
\tinfoAttrsResolved, err := filepath.EvalSymlinks(infoAttrs)
\tif err == nil {
\t\tinfoAttrsResolved, err = filepath.Abs(infoAttrsResolved)
\t\tif err != nil { return fmt.Errorf("resolve Git info attributes identity path: %w", err) }
\t\tif infoAttrsResolved == configuredResolved { return fmt.Errorf("git target is configured as the active info/attributes file") }
\t} else if !os.IsNotExist(err) {
\t\treturn fmt.Errorf("resolve Git info attributes identity: %w", err)
\t}
\treturn nil
}

func rejectGitConfigTarget'''
          if marker not in s: raise SystemExit('attributes marker not found')
          s=s.replace(marker,repl,1)

          # Parse include.path output using the actual whitespace delimiter.
          old='''\t\tfor _, line := range strings.Split(includeOutput, "\\n") {
\t\t\tline = strings.TrimSpace(line)
\t\t\tif line == "" {
\t\t\t\tcontinue
\t\t\t}
\t\t\t_, include, ok := strings.Cut(line, "\\t")
\t\t\tif !ok || include == "" {
\t\t\t\tcontinue
\t\t\t}
\t\t\tif !filepath.IsAbs(include) {
\t\t\t\tinclude = filepath.Join(filepath.Dir(resolvedSource), include)
\t\t\t}
\t\t\taddSource(include)
\t\t}'''
          new='''\t\tfor _, line := range strings.Split(includeOutput, "\\n") {
\t\t\tline = strings.TrimSpace(line)
\t\t\tif line == "" { continue }
\t\t\tidx := strings.IndexAny(line, " \\t")
\t\t\tif idx < 0 { continue }
\t\t\tinclude := strings.TrimSpace(line[idx+1:])
\t\t\tif include == "" { continue }
\t\t\tif !filepath.IsAbs(include) { include = filepath.Join(filepath.Dir(resolvedSource), include) }
\t\t\taddSource(include)
\t\t}'''
          if old not in s: raise SystemExit('include parser not found')
          s=s.replace(old,new,1)

          # Reject empty target at construction.
          old='''\tif err := validateNoSymlinks(target); err != nil {
\t\treturn Target{}, err
\t}
\treturn target, nil
}'''
          new='''\tif err := validateNoSymlinks(target); err != nil {
\t\treturn Target{}, err
\t}
\tcontent, err := readFile(context.Background(), target)
\tif err != nil { return Target{}, err }
\tif content == "" { return Target{}, fmt.Errorf("git target must not be empty") }
\treturn target, nil
}'''
          if old not in s: raise SystemExit('NewTarget marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('integrations/git/provider_test.go')
          ts=t.read_text()
          empty='''\nfunc TestNewTargetRejectsEmptyFile(t *testing.T) {
\tdir := t.TempDir()
\tgitTest(t, dir, "init")
\tgitTest(t, dir, "config", "user.email", "ackos-test@example.invalid")
\tgitTest(t, dir, "config", "user.name", "ackOS test")
\tpath := filepath.Join(dir, "empty.txt")
\tif err := os.WriteFile(path, nil, 0o644); err != nil { t.Fatal(err) }
\tgitTest(t, dir, "add", "--", "empty.txt")
\tgitTest(t, dir, "commit", "-m", "initial")
\tif _, err := NewTarget(dir, "empty.txt", "repo:empty.txt"); err == nil || !strings.Contains(err.Error(), "must not be empty") {
\t\tt.Fatalf("NewTarget error = %v, want empty-target rejection", err)
\t}
}\n'''
          marker='\nfunc TestNewTargetRejectsPathTraversal'
          if marker not in ts: raise SystemExit('empty test marker not found')
          ts=ts.replace(marker,empty+marker,1)
          t.write_text(ts)
          Path('.github/workflows/pr10-one-shot.yml').unlink(missing_ok=True)
          Path('.github/pr10-remaining-trigger.txt').unlink(missing_ok=True)
          PY
      - name: Format and test
        run: |
          gofmt -w integrations/git/provider.go integrations/git/provider_test.go
          go test ./...
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/git/provider.go integrations/git/provider_test.go .github/workflows/pr10-one-shot.yml .github/pr10-remaining-trigger.txt
          git commit -m 'fix: apply remaining PR10 fixes'
          git push origin HEAD:fix/pr10-codex-hardening
