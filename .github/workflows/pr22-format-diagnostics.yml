# Temporary formatting diagnostics for PR #22. Remove after the exact gofmt diff is addressed.

name: PR 22 Format Diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr22-format-diagnostics.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Show gofmt diagnostics
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            gofmt -d .
            exit 1
          fi
