name: Temporary Codex Fix

on:
  push:
    branches:
      - feat/phase2-git-provider

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply provider fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("integrations/git/provider.go")
          s = p.read_text()
          old = '''\tif !info.Mode().IsRegular() {\n\t\treturn "", fmt.Errorf("git target is not a regular file")\n\t}\n\tcontent, err := io.ReadAll(file)'''
          new = '''\tif !info.Mode().IsRegular() {\n\t\treturn "", fmt.Errorf("git target is not a regular file")\n\t}\n\tif stat, ok := info.Sys().(*syscall.Stat_t); ok && stat.Nlink > 1 {\n\t\treturn "", fmt.Errorf("git target has multiple hard links")\n\t}\n\tcontent, err := io.ReadAll(file)'''
          if old not in s:
              raise SystemExit("hardlink insertion point not found")
          s = s.replace(old, new, 1)
          old = '''\tif current != t.Before {\n\t\treturn kernel.ExecutionResult{Message: "git file changed at mutation boundary"}\n\t}\n\tif err := os.WriteFile'''
          new = '''\tif current != t.Before {\n\t\treturn kernel.ExecutionResult{Message: "git file changed at mutation boundary"}\n\t}\n\tif filepath.Base(e.Target.Path) == ".gitattributes" {\n\t\treturn kernel.ExecutionResult{Message: "git .gitattributes targets are not supported because the target can change its own filter environment"}\n\t}\n\tif err := os.WriteFile'''
          if old not in s:
              raise SystemExit("gitattributes insertion point not found")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gofmt -w integrations/git/provider.go
      - name: Test
        run: go test ./...
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/git/provider.go
          git commit -m "fix: reject hardlink and self-filter Git targets"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git checkout -- .github/workflows/temporary-codex-fix.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temporary-codex-fix.yml || true
          git commit -m "chore: remove temporary fix workflow" || true
          git push || true
