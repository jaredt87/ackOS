name: Apply PR 10 review fixes

on:
  push:
    branches:
      - feat/phase2-git-provider

permissions:
  contents: write

jobs:
  fix:
    if: github.ref_name == 'feat/phase2-git-provider'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-git-provider
          fetch-depth: 0

      - name: Patch provider
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          s = s.replace('import (\n\t"context"', 'import (\n\t"bytes"\n\t"context"', 1)
          s = s.replace('''\tif before != t.Before {\n\t\treturn kernel.ExecutionResult{Message: "git file changed before execution"}\n\t}\n\tstatus, err := e.git(ctx, "status", "--porcelain", "--untracked-files=all")''', '''\tif before != t.Before {\n\t\treturn kernel.ExecutionResult{Message: "git file changed before execution"}\n\t}\n\tif err := requireNoInProgressGitOperation(ctx, e.Target); err != nil {\n\t\treturn kernel.ExecutionResult{Message: err.Error()}\n\t}\n\tstatus, err := e.git(ctx, "status", "--porcelain", "--untracked-files=all")''', 1)
          s = s.replace('''\tif current != t.Before {\n\t\treturn kernel.ExecutionResult{Message: "git file changed at mutation boundary"}\n\t}\n\tif filepath.Base(e.Target.Path) == ".gitattributes" {''', '''\tif current != t.Before {\n\t\treturn kernel.ExecutionResult{Message: "git file changed at mutation boundary"}\n\t}\n\tif err := requireNoInProgressGitOperation(ctx, e.Target); err != nil {\n\t\treturn kernel.ExecutionResult{Message: err.Error()}\n\t}\n\tif filepath.Base(e.Target.Path) == ".gitattributes" {''', 1)
          marker = 'func requireWorktreeRoot(target Target) error {\n'
          helper = '''func requireNoInProgressGitOperation(ctx context.Context, target Target) error {\n\tfor _, marker := range []string{"MERGE_HEAD", "CHERRY_PICK_HEAD", "REVERT_HEAD", "REBASE_HEAD"} {\n\t\tpath, err := runGit(ctx, target.Repository, "rev-parse", "--git-path", marker)\n\t\tif err != nil {\n\t\t\treturn fmt.Errorf("inspect Git operation state: %w", err)\n\t\t}\n\t\tif _, err := os.Stat(strings.TrimSpace(path)); err == nil {\n\t\t\treturn fmt.Errorf("Git operation is already in progress: %s", marker)\n\t\t} else if !os.IsNotExist(err) {\n\t\t\treturn fmt.Errorf("inspect Git operation state %s: %w", marker, err)\n\t\t}\n\t}\n\tfor _, marker := range []string{"sequencer", "rebase-merge", "rebase-apply"} {\n\t\tpath, err := runGit(ctx, target.Repository, "rev-parse", "--git-path", marker)\n\t\tif err != nil {\n\t\t\treturn fmt.Errorf("inspect Git operation state: %w", err)\n\t\t}\n\t\tif info, err := os.Stat(strings.TrimSpace(path)); err == nil && info.IsDir() {\n\t\t\treturn fmt.Errorf("Git operation is already in progress: %s", marker)\n\t\t} else if err != nil && !os.IsNotExist(err) {\n\t\t\treturn fmt.Errorf("inspect Git operation state %s: %w", marker, err)\n\t\t}\n\t}\n\treturn nil\n}\n\n'''
          if marker not in s:
              raise SystemExit('worktree helper marker not found')
          s = s.replace(marker, helper + marker, 1)
          old = '''func runGit(ctx context.Context, repository string, args ...string) (string, error) {\n\tcmd := exec.CommandContext(ctx, "git", args...)\n\tcmd.Dir = repository\n\toutput, err := cmd.CombinedOutput()\n\tif err != nil {\n\t\treturn "", fmt.Errorf("%w: %s", err, strings.TrimSpace(string(output)))\n\t}\n\tif len(args) > 0 && args[0] == "show" {\n\t\treturn string(output), nil\n\t}\n\treturn strings.TrimSpace(string(output)), nil\n}\n'''
          new = '''func runGit(ctx context.Context, repository string, args ...string) (string, error) {\n\tcmd := exec.CommandContext(ctx, "git", args...)\n\tcmd.Dir = repository\n\tvar stdout, stderr bytes.Buffer\n\tcmd.Stdout = &stdout\n\tcmd.Stderr = &stderr\n\tif err := cmd.Run(); err != nil {\n\t\treturn "", fmt.Errorf("%w: %s", err, strings.TrimSpace(stderr.String()))\n\t}\n\toutput := stdout.String()\n\tif len(args) > 0 && args[0] == "show" {\n\t\treturn output, nil\n\t}\n\treturn strings.TrimSpace(output), nil\n}\n'''
          if old not in s:
              raise SystemExit('runGit block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gofmt -w integrations/git/provider.go

      - name: Add regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider_test.go')
          s = p.read_text()
          anchor = 'func TestNewTargetRejectsPathTraversal(t *testing.T) {\n'
          tests = '''func TestExecutorRejectsPendingGitMerge(t *testing.T) {\n\ttarget, observer, executor, _, _ := newTestProvider(t, "initial")\n\tobservation, err := observer.Observe(context.Background(), target.Subject)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgitTest(t, target.Repository, "checkout", "-b", "merge-test")\n\tgitTest(t, target.Repository, "checkout", "main")\n\tgitTest(t, target.Repository, "merge", "--no-commit", "merge-test")\n\ttransition := kernel.Transition{Subject: target.Subject, Before: observation.State, After: "updated"}\n\tresult := executor.Execute(context.Background(), transition, kernel.Authority{ExecutionID: "attempt-pending-merge"})\n\tif result.Success || !strings.Contains(result.Message, "MERGE_HEAD") {\n\t\tt.Fatalf("result = %+v, want pending-merge rejection", result)\n\t}\n\tif got := readTestFile(t, target); got != "initial" {\n\t\tt.Fatalf("target changed during pending merge rejection: %q", got)\n\t}\n\tgitTest(t, target.Repository, "merge", "--abort")\n}\n\n'''
          if anchor not in s:
              raise SystemExit('test anchor not found')
          s = s.replace(anchor, tests + anchor, 1)
          p.write_text(s)
          PY
          gofmt -w integrations/git/provider_test.go

      - name: Remove temporary workflow and trigger
        run: rm -f .github/workflows/fix-pr10-review.yml PR10_FIX_TRIGGER

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/git/provider.go integrations/git/provider_test.go .github/workflows/fix-pr10-review.yml PR10_FIX_TRIGGER
          git commit -m "fix: address latest Git provider review findings"
          git push origin HEAD:feat/phase2-git-provider
