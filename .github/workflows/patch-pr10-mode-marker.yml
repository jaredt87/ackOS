name: Patch PR10 review findings
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'jaredt87'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-git-provider
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          old = '''\tmodeOutput, err := runGit(ctx, target.Repository, "ls-files", "--format=%(objectmode)", "--", literalPathspec(target.Path))\n\tif err != nil {\n\t\treturn fmt.Errorf("read target Git mode: %w", err)\n\t}\n\tmode := strings.TrimSpace(modeOutput)\n\tif mode == "" {\n\t\treturn fmt.Errorf("target Git mode is missing")\n\t}\n'''
          new = '''\tmode, err := gitTreeMode(ctx, target, parent)\n\tif err != nil {\n\t\treturn fmt.Errorf("read parent target Git mode: %w", err)\n\t}\n'''
          if old not in s: raise SystemExit('commit mode block not found')
          s = s.replace(old, new, 1)
          old = '''\tmessage, err := safeGit("log", "-1", "--format=%B")\n'''
          new = '''\tmessage, err := safeGit("log", "-1", "--format=%B", head)\n'''
          if old not in s: raise SystemExit('message lookup not found')
          s = s.replace(old, new, 1)
          old = '''\tif !exactNULPathList(paths, target.Path) {\n\t\treturn fmt.Errorf("committed Git diff contains an unauthorized path")\n\t}\n\tbeforeHash, err := safeGit("rev-parse", head+"^:./"+target.Path)\n'''
          new = '''\tif !exactNULPathList(paths, target.Path) {\n\t\treturn fmt.Errorf("committed Git diff contains an unauthorized path")\n\t}\n\tparentMode, err := gitTreeMode(ctx, target, head+"^")\n\tif err != nil {\n\t\treturn fmt.Errorf("read committed Git parent mode: %w", err)\n\t}\n\ttargetMode, err := gitTreeMode(ctx, target, head)\n\tif err != nil {\n\t\treturn fmt.Errorf("read committed Git target mode: %w", err)\n\t}\n\tif parentMode != targetMode {\n\t\treturn fmt.Errorf("committed Git target mode changed unexpectedly")\n\t}\n\tbeforeHash, err := safeGit("rev-parse", head+"^:./"+target.Path)\n'''
          if old not in s: raise SystemExit('verify mode insertion point not found')
          s = s.replace(old, new, 1)
          marker = '''func gitBlobHash(ctx context.Context, target Target, content string) (string, error) {\n'''
          helper = '''func gitTreeMode(ctx context.Context, target Target, tree string) (string, error) {\n\toutput, err := runGit(ctx, target.Repository, "--no-replace-objects", "ls-tree", "--format=%(objectmode)", tree, "--", literalPathspec(target.Path))\n\tif err != nil {\n\t\treturn "", err\n\t}\n\tlines := strings.Fields(output)\n\tif len(lines) != 1 || (lines[0] != "100644" && lines[0] != "100755") {\n\t\treturn "", fmt.Errorf("target Git tree entry is not a regular file")\n\t}\n\treturn lines[0], nil\n}\n\n'''
          if marker not in s: raise SystemExit('blob hash marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          t = Path('integrations/git/current_findings_test.go')
          ts = t.read_text()
          if '"github.com/jaredt87/ackOS/kernel"' not in ts:
              ts = ts.replace('"testing"\n', '"testing"\n\n\t"github.com/jaredt87/ackOS/kernel"\n')
          if 'func TestVerifyCommitRejectsTargetModeChange' not in ts:
              ts += r'''\nfunc TestVerifyCommitRejectsTargetModeChange(t *testing.T) {\n\ttarget, _, _, _, _ := newTestProvider(t, "initial")\n\tgitTest(t, target.Repository, "config", "user.email", "ackos-test@example.invalid")\n\tgitTest(t, target.Repository, "config", "user.name", "ackOS test")\n\n\tblob := strings.TrimSpace(gitTest(t, target.Repository, "hash-object", "-w", "--stdin"))\n\tgitTest(t, target.Repository, "update-index", "--add", "--cacheinfo", "120000,"+blob+","+target.Path)\n\ttree := strings.TrimSpace(gitTest(t, target.Repository, "write-tree"))\n\tparent := strings.TrimSpace(gitTest(t, target.Repository, "rev-parse", "HEAD"))\n\tcommit := strings.TrimSpace(gitTest(t, target.Repository, "commit-tree", tree, "-p", parent, "-m", "ackOS: execute mode-test"))\n\tgitTest(t, target.Repository, "update-ref", "HEAD", commit)\n\n\ttransition := kernel.Transition{Subject: target.Subject, Before: "initial", After: "initial"}\n\terr := verifyCommitAt(context.Background(), target, func(args ...string) (string, error) { return runGit(context.Background(), target.Repository, args...) }, parent, transition, "mode-test")\n\tif err == nil || !strings.Contains(err.Error(), "mode") {\n\t\tt.Fatalf("error = %v, want target mode rejection", err)\n\t}\n}\n\nfunc TestVerifyCommitReadsMarkerFromCapturedCommit(t *testing.T) {\n\ttarget, _, _, _, _ := newTestProvider(t, "initial")\n\tgitTest(t, target.Repository, "config", "user.email", "ackos-test@example.invalid")\n\tgitTest(t, target.Repository, "config", "user.name", "ackOS test")\n\n\twrongHead := strings.TrimSpace(gitTest(t, target.Repository, "rev-parse", "HEAD"))\n\tgitTest(t, target.Repository, "commit", "--allow-empty", "-m", "ackOS: execute marker-test")\n\n\ttransition := kernel.Transition{Subject: target.Subject, Before: "initial", After: "initial"}\n\terr := verifyCommitAt(context.Background(), target, func(args ...string) (string, error) { return runGit(context.Background(), target.Repository, args...) }, wrongHead, transition, "marker-test")\n\tif err == nil || !strings.Contains(err.Error(), "parent") {\n\t\tt.Fatalf("error = %v, want captured-commit verification failure", err)\n\t}\n}\n'''
          t.write_text(ts)
          PY
          gofmt -w integrations/git/provider.go integrations/git/current_findings_test.go
          go test ./integrations/git
      - name: Commit fixes
        run: |
          git config user.name 'ackOS automation'
          git config user.email 'ackos-automation@example.invalid'
          git add integrations/git/provider.go integrations/git/current_findings_test.go
          git diff --cached --quiet && exit 0
          git commit -m 'fix: address PR10 mode and marker findings'
          git push origin HEAD:feat/phase2-git-provider
