name: Debug Go Format

on:
  push:
    branches:
      - feat/plugin-architecture-v2

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: List unformatted Go files
        run: gofmt -l .
