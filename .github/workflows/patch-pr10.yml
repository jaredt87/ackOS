name: PR10 patch
on:
  push:
    branches: [feat/phase2-git-provider]
jobs:
  patch:
    if: github.actor == 'jaredt87' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-git-provider
          fetch-depth: 0
      - name: Patch provider
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations/git/provider.go')
          s = p.read_text()
          s = s.replace('requireWorktreeRoot(target)', 'requireWorktreeRoot(context.Background(), target)', 1)
          s = s.replace('requireWorktreeRoot(e.Target)', 'requireWorktreeRoot(ctx, e.Target)')
          s = s.replace('requireWorktreeRoot(v.Target)', 'requireWorktreeRoot(ctx, v.Target)')
          s = s.replace('func requireWorktreeRoot(target Target) error {\n\troot, err := runGit(context.Background(), target.Repository, "rev-parse", "--show-toplevel")', 'func requireWorktreeRoot(ctx context.Context, target Target) error {\n\troot, err := runGit(ctx, target.Repository, "rev-parse", "--show-toplevel")')
          s = s.replace('gitFilteredBlobHash(context.Background(), target, t.Before)', 'gitFilteredBlobHash(ctx, target, t.Before)')
          s = s.replace('gitFilteredBlobHash(context.Background(), target, t.After)', 'gitFilteredBlobHash(ctx, target, t.After)')
          old = '''\tstatus, err := e.git(ctx, "ls-files", "-v", "--error-unmatch", "--", e.Target.Path)\n\tif err != nil {\n\t\treturn fmt.Errorf("inspect Git target index state: %v", err)\n\t}\n\tif len(status) == 0 || (status[0] >= 'a' && status[0] <= 'z') || status[0] == 'S' {\n\t\treturn fmt.Errorf("git target is assume-unchanged and cannot be staged")\n\t}'''
          new = '''\tstatus, err := e.git(ctx, "ls-files", "-v", "-z", "--error-unmatch", "--", e.Target.Path)\n\tif err != nil {\n\t\treturn fmt.Errorf("inspect Git target index state: %v", err)\n\t}\n\tif !validIndexPathStatus(status, e.Target.Path) {\n\t\treturn fmt.Errorf("git target index state is not stageable")\n\t}'''
          if s.count(old) != 1: raise SystemExit('executor index block not found')
          s = s.replace(old,new)
          old = '''\tstatus, err := v.git(ctx, "ls-files", "-v", "--error-unmatch", "--", v.Target.Path)\n\tif err != nil {\n\t\treturn fmt.Errorf("inspect Git target index state: %v", err)\n\t}\n\tif len(status) == 0 || (status[0] >= 'a' && status[0] <= 'z') || status[0] == 'S' {\n\t\treturn fmt.Errorf("git target is assume-unchanged and cannot be staged")\n\t}'''
          new = '''\tstatus, err := v.git(ctx, "ls-files", "-v", "-z", "--error-unmatch", "--", v.Target.Path)\n\tif err != nil {\n\t\treturn fmt.Errorf("inspect Git target index state: %v", err)\n\t}\n\tif !validIndexPathStatus(status, v.Target.Path) {\n\t\treturn fmt.Errorf("git target index state is not stageable")\n\t}'''
          if s.count(old) != 1: raise SystemExit('verifier index block not found')
          s = s.replace(old,new)
          marker = 'func exactNULPathList(output, expected string) bool {'
          helper = '''func validIndexPathStatus(output, expected string) bool {\n\toutput = strings.TrimSuffix(output, "\\x00")\n\trecords := strings.Split(output, "\\x00")\n\tif len(records) != 1 || len(records[0]) < 3 || records[0][1] != ' ' || records[0][2:] != expected {\n\t\treturn false\n\t}\n\tstatus := records[0][0]\n\treturn status != 'S' && !(status >= 'a' && status <= 'z')\n}\n\n'''
          if marker not in s: raise SystemExit('helper marker not found')
          s = s.replace(marker, helper + marker, 1)
          old = '''\tif err := verifyCommit(e, ctx, head, t, authority.ExecutionID); err != nil {\n\t\treturn kernel.ExecutionResult{Message: err.Error()}\n\t}\n\treturn kernel.ExecutionResult{Success: true, Message: "git file transitioned and committed"}'''
          new = '''\tif err := verifyCommit(e, ctx, head, t, authority.ExecutionID); err != nil {\n\t\treturn kernel.ExecutionResult{Message: err.Error()}\n\t}\n\tfinalContent, err := e.read(ctx)\n\tif err != nil {\n\t\treturn kernel.ExecutionResult{Message: fmt.Sprintf("re-read Git target after verification: %v", err)}\n\t}\n\tif finalContent != t.After {\n\t\treturn kernel.ExecutionResult{Message: "git target changed after commit verification"}\n\t}\n\treturn kernel.ExecutionResult{Success: true, Message: "git file transitioned and committed"}'''
          if s.count(old) != 1: raise SystemExit('post verify block not found')
          s = s.replace(old,new)
          old = '''\tif len(args) > 0 && args[0] == "show" {\n\t\treturn output, nil\n\t}\n\treturn strings.TrimSpace(output), nil'''
          new = '''\tfor _, arg := range args {\n\t\tif arg == "-z" {\n\t\t\treturn output, nil\n\t\t}\n\t}\n\tif len(args) > 0 && args[0] == "show" {\n\t\treturn output, nil\n\t}\n\treturn strings.TrimSpace(output), nil'''
          if s.count(old)!=1: raise SystemExit('runGit block not found')
          s = s.replace(old,new)
          p.write_text(s)
          PY
          gofmt -w integrations/git/provider.go
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/git/provider.go
          git commit -m 'fix: close remaining Git provider review gaps'
          git push origin HEAD:feat/phase2-git-provider
